      list = Object.entries(m.SONG_META).filter(([, v]) => (v[6] || '').includes('w') && v[1].split(',').some(u => UNIT[u]))
        .map(([id, v]) => ({ id, title: v[0] || title[id] || '', unit: UNIT[v[1].split(',').find(u => UNIT[u])], abn: v[11] || v[10] })).filter(x => x.abn && x.title);
    } catch (e) { list = []; }
    return list;
  }
  function fade(to, sec, done) {
    if (!a) return; cancelAnimationFrame(fadeT); const from = a.volume, t0 = performance.now(), el = a;
    const step = now => { const x = Math.min(1, (now - t0) / (sec * 1000)); try { el.volume = Math.max(0, Math.min(1, from + (to - from) * x)); } catch (e) {} if (x < 1) fadeT = requestAnimationFrame(step); else if (done) done(); };
    fadeT = requestAnimationFrame(step);
  }
  async function pick() {
    const L = await load(); if (!L.length) return null;
    const s = L[Math.floor(Math.random() * L.length)];
    const el = new Audio(); el.preload = 'auto'; el.crossOrigin = null; el.volume = 0; el.src = BASE + s.abn + '/' + s.abn + '.mp3';
    el.addEventListener('loadedmetadata', () => { try { if (el.duration > START + 40) el.currentTime = START; } catch (e) {} }, { once: true });
    el.addEventListener('error', () => { if (el === a && tries < 3) { tries++; a = null; cur = null; start(); } });
    el.addEventListener('ended', () => { if (el === a) { a = null; cur = null; start(); } });   // 展示比歌長：換下一首
    a = el; cur = s; showLbl(); return el;
  }
  function showLbl() { const e = lbl(); if (e) e.textContent = cur ? '♪ ' + cur.title + ' — ' + cur.unit : ''; }
  let lastT = 0, lastD = 0;
  async function start(t, D) {
    if (t != null) { lastT = t; lastD = D; }
    if (!a) await pick(); if (!a) return;
    try { await a.play(); } catch (e) { return; }
    fade(on ? VOL * edge(lastT, lastD) : 0, FIN);
  }
  const edge = (t, D) => (D && t > D - FOUT) ? Math.max(0, (D - t) / FOUT) : 1;
  return {
    get on() { return on; },
    start,
    tick(t, D) { lastT = t; lastD = D; if (a && on && t > D - FOUT) { try { a.volume = VOL * edge(t, D); } catch (e) {} } },
    pause() { if (a) { const el = a; fade(0, .5, () => { try { el.pause(); } catch (e) {} }); } },
    toggle(t, D, playing) { on = !on; if (!a) return; if (on && playing) { if (a.paused) a.play().catch(() => {}); fade(VOL * edge(t, D), .6); } else fade(0, .4); },
    reroll() { if (a) { try { a.pause(); } catch (e) {} } a = null; cur = null; tries = 0; showLbl(); }
  };
})();


/* ════════ 播放器：即時播放、拖進度、章節、配樂、分享 ════════ */
(() => {
  const $ = q => document.querySelector(q);
  const stage = $('#stage'), wrap = $('#wrap');
  const D = window.DUR, SP = window.SPEED, R = window.render;
  const CH = [['開場', 0], ...SCN.map(x => [x[3], x[0] / SP]), ['結尾', (TL.end[0] + .2) / SP]];
  let t = 0, playing = false, last = 0, started = false, hideT = null, raf = 0;
  const qs = new URLSearchParams(location.search), t0 = parseFloat(qs.get('t'));
  if (t0 > 0 && t0 < D) t = t0;
  function fit() { const s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = `translate(-50%,-50%) scale(${s})`; }
  addEventListener('resize', fit); fit();
  const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  const bar = $('#bar'), fill = $('#fill'), knob = $('#knob'), tm = $('#tm'), chName = $('#chName');
  // 章節刻度與按鈕
  CH.forEach(([n, a], i) => { if (i) { const k = document.createElement('i'); k.className = 'tick'; k.style.left = (a / D * 100) + '%'; bar.appendChild(k); }
    const b = document.createElement('button'); b.className = 'chb'; b.textContent = n; b.onclick = e => { e.stopPropagation(); seek(a + .01); if (!playing) play(); }; $('#chs').appendChild(b); });
  function curCh() { let k = 0; CH.forEach(([, a], i) => { if (t >= a) k = i; }); return k; }
  function ui() { const f = t / D * 100; fill.style.width = f + '%'; knob.style.left = f + '%'; tm.textContent = fmt(t) + ' / ' + fmt(D);
    const k = curCh(); chName.textContent = CH[k][0]; [...$('#chs').children].forEach((b, i) => b.classList.toggle('on', i === k));
    $('#pp').innerHTML = playing ? ICP.pause : ICP.play; $('#pp').setAttribute('aria-label', playing ? '暫停' : '播放'); }
  function frame(now) { if (!playing) return; const dt = Math.min(.1, (now - last) / 1000); last = now; t += dt;
    if (t >= D) { t = D; R(t); pause(); $('#end').hidden = false; ui(); return; }
    Music.tick(t, D);
    R(t); ui(); raf = requestAnimationFrame(frame); }
  function play() { if (t >= D - .05) t = 0; playing = true; started = true; $('#start').hidden = true; $('#end').hidden = true; last = performance.now(); Music.start(t, D); cancelAnimationFrame(raf); raf = requestAnimationFrame(frame); ui(); poke(); }
  function pause() { playing = false; Music.pause(); cancelAnimationFrame(raf); ui(); poke(); }
  function seek(x) { t = clamp(x, 0, D); R(t); ui(); $('#end').hidden = true; }
  window.__demo = { get t() { return t; }, get playing() { return playing; }, seek, play, pause };
  $('#pp').onclick = e => { e.stopPropagation(); playing ? pause() : play(); };
  $('#bigPlay').onclick = () => play(); $('#replay').onclick = () => { t = 0; Music.reroll(); play(); };
  $('#start').onclick = e => { if (e.target === $('#start')) play(); };
  stage.onclick = () => { if (started) { playing ? pause() : play(); } };
  // 拖進度
  let drag = false;
  const at = e => { const r = bar.getBoundingClientRect(); return clamp((e.clientX - r.left) / r.width) * D; };
  bar.addEventListener('pointerdown', e => { drag = true; bar.setPointerCapture(e.pointerId); seek(at(e)); e.stopPropagation(); });
  bar.addEventListener('pointermove', e => { if (drag) seek(at(e)); const r = bar.getBoundingClientRect(); $('#tip').style.left = (e.clientX - r.left) + 'px'; $('#tip').textContent = fmt(at(e)); });
  ['pointerup', 'pointercancel'].forEach(ev => bar.addEventListener(ev, () => { drag = false; if (playing) last = performance.now(); }));
  // 配樂開關
  $('#mu').onclick = e => { e.stopPropagation(); Music.toggle(t, D, playing); $('#mu').innerHTML = Music.on ? ICP.mus : ICP.musOff; $('#mu').setAttribute('aria-label', Music.on ? '關閉配樂' : '開啟配樂'); toast(Music.on ? '配樂：開' : '配樂：關'); };
  // 全螢幕
  $('#fs').onclick = e => { e.stopPropagation(); const d = document; if (d.fullscreenElement) d.exitFullscreen(); else (wrap.requestFullscreen || wrap.webkitRequestFullscreen || (() => {})).call(wrap); };
  // 分享：網址帶目前時間點
  function link(withT) { const u = new URL(location.href); u.search = ''; u.hash = ''; if (withT && t > 1 && t < D - 1) u.searchParams.set('t', Math.floor(t)); return u.toString(); }
  function copy(s, msg) { (navigator.clipboard ? navigator.clipboard.writeText(s) : Promise.reject()).then(() => toast(msg)).catch(() => { const a = document.createElement('textarea'); a.value = s; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); toast(msg); } catch (e) { toast('複製失敗'); } a.remove(); }); }
  async function share(withT) { const u = link(withT);
    if (navigator.share && matchMedia('(pointer:coarse)').matches) { try { await navigator.share({ title: '菜根機器人 · 功能展示', text: 'Discord × 網頁 × Google 試算表，一份班表三處同步', url: u }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
    copy(u, withT && u.includes('t=') ? '已複製連結（從 ' + fmt(t) + ' 開始）' : '已複製分享連結'); }
  $('#sh').onclick = e => { e.stopPropagation(); share(true); }; $('#shEnd').onclick = () => share(false); $('#shStart').onclick = e => { e.stopPropagation(); share(false); };
  function toast(s) { const e = $('#toast'); e.textContent = s; e.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => e.classList.remove('on'), 1800); }
  // 控制列自動隱藏
  function poke() { wrap.classList.add('ctl'); clearTimeout(hideT); if (playing) hideT = setTimeout(() => wrap.classList.remove('ctl'), 2600); }
  ['pointermove', 'pointerdown', 'keydown'].forEach(ev => addEventListener(ev, poke));
  addEventListener('keydown', e => { if (e.target.closest && e.target.closest('input,textarea')) return;
    if (e.key === ' ' || e.key === 'k') { e.preventDefault(); playing ? pause() : play(); }
    else if (e.key === 'ArrowRight') seek(t + 5); else if (e.key === 'ArrowLeft') seek(t - 5);
    else if (e.key === 'm') $('#mu').click(); else if (e.key === 'f') $('#fs').click(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && playing) pause(); });
  bar.setAttribute('aria-valuemax', String(Math.round(D))); $('#mu').innerHTML = ICP.mus; $('#sh').innerHTML = ICP.share; $('#fs').innerHTML = ICP.fs;
  if (t > 0) $('#startHint').textContent = '從 ' + fmt(t) + ' 開始';
  R(t); ui(); wrap.classList.add('ctl');
})();
