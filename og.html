<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>og</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800&family=Noto+Sans+TC:wght@500;700&display=block">
<!-- 分享預覽圖的版型：tools/build-og.mjs 用無頭瀏覽器把每頁的標題與說明套進來截成 og/<page>.jpg。
     不吃站上的 CSS 與字型（截圖機器沒網路也要能跑），字型用系統的中文字體。 -->
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;font-family:"Noto Sans TC","M PLUS Rounded 1c",system-ui,"Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif}
body{background:linear-gradient(135deg,#273052 0%,#3b4878 100%);color:#fff;position:relative}
.bar{position:absolute;top:0;left:0;right:0;height:14px;background:linear-gradient(90deg,#4ad1e8,#3ee0a8,#b8e561,#ffd94d,#ff9db4,#c39df2,#7fb4f7)}
.glow{position:absolute;inset:0;background:radial-gradient(520px 260px at 90% -10%,rgba(120,180,255,.32),transparent 70%)}
.wrap{position:absolute;left:84px;right:84px;top:96px}
.brand{display:flex;align-items:center;gap:18px;font-size:28px;font-weight:800;letter-spacing:3px;opacity:.92;font-family:"M PLUS Rounded 1c","Noto Sans TC",sans-serif}
.brand img{width:72px;height:72px;border-radius:18px;box-shadow:0 10px 26px rgba(0,0,0,.35)}
.mark{position:absolute;right:84px;top:96px;width:200px;height:200px;border-radius:48px;box-shadow:0 18px 50px rgba(0,0,0,.4)}
.title{font-size:80px;font-weight:700;line-height:1.18;margin-top:26px;letter-spacing:1px;font-family:"Noto Sans TC","M PLUS Rounded 1c",sans-serif}
.desc{font-size:30px;line-height:1.6;opacity:.82;margin-top:22px;max-height:150px;overflow:hidden;font-weight:500}
.foot{position:absolute;left:84px;right:84px;bottom:56px;display:flex;align-items:center;justify-content:space-between;font-size:24px;font-weight:700;opacity:.7;font-family:"M PLUS Rounded 1c","Noto Sans TC",sans-serif;letter-spacing:.5px}
.chips{display:flex;gap:10px}.chip{padding:8px 18px;border-radius:999px;background:rgba(255,255,255,.14);font-size:22px}
</style></head><body>
<span class="bar"></span><span class="glow"></span>
<img class="mark" src="icons/icon-512.png" alt=""><div class="wrap" style="right:330px"><div class="brand"><img src="icons/icon-512.png" alt="">SEKAI 資源中心</div><div class="title" id="t">SEKAI 資源中心</div><div class="desc" id="d"></div></div>
<div class="foot"><span>project-sekai-center.com</span><span class="chips"><span class="chip">台服</span><span class="chip">Project SEKAI</span></span></div>
<script>
const q = new URLSearchParams(location.search);
const t = q.get('t') || 'SEKAI 資源中心', d = q.get('d') || '';
document.getElementById('t').textContent = t; document.getElementById('d').textContent = d;
if (t.length > 9) document.getElementById('t').style.fontSize = '64px';
</script>
</body></html>
