<script type="module">
import { SCHED_FORECAST as F } from './data/schedule-forecast.js?v=35367d09d7';

import { CARDS } from './data/cards-index.js?v=4d50ff39a7';

const CARD = {}; CARDS.forEach(c => CARD[c[0]] = c);
const TYPE = { pickup: 'PU 池', rerun: '復刻', select: '選擇', pass: '通行證', birthday: '生日池', normal: '一般', newyear: '新春', gift: '禮物', anniv: '周年', wl: 'World Link', fes: 'FES', free: '免費', beginner: '新手' };

$('#themeBtn').onclick = () => { const d = document.documentElement.classList.toggle('dark'); try { localStorage.setItem('sekai-plan-theme', d ? 'dark' : 'light'); } catch (e) {} };
/* 狀態：輸入值、想抽的池（id → 抽數）、持卡 */
const S = { free: 0, paid: 0, ticket: 0, perDay: 40, perEv: 1500, perMo: 800, months: 12, picks: {}, own: null, pid: '', filt: 'main' };
const KEY = 'sekai-plan-v1';
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
const q = new URLSearchParams(location.search), h = new URLSearchParams(location.hash.slice(1));
if (h.get('p')) { try { Object.assign(S, JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(h.get('p').replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0))))); toast('已載入分享的計畫'); } catch (e) {} }
if (q.get('id')) S.pid = q.get('id'); if (!S.pid) { try { S.pid = localStorage.getItem('sekai-profile-last') || localStorage.getItem('sekai-app-pid') || ''; } catch (e) {} }
['free', 'paid', 'ticket', 'perDay', 'perEv', 'perMo', 'months'].forEach(k => { $('#' + k).value = S[k]; $('#' + k).oninput = () => { S[k] = +$('#' + k).value || 0; save(); render(); }; });

$('#share').onclick = () => { const o = { free: S.free, paid: S.paid, ticket: S.ticket, perDay: S.perDay, perEv: S.perEv, perMo: S.perMo, months: S.months, picks: S.picks }; const b = btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(o)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); navigator.clipboard.writeText(location.origin + location.pathname + '#p=' + b).then(() => toast('連結已複製')).catch(() => toast('複製失敗')); };

const DAY = 86400e3, now = Date.now();

function income(t) { const days = Math.max(0, (t - now) / DAY); const nEv = evs.filter(e => e <= t).length; return days * S.perDay + nEv * S.perEv + Math.floor(days / 30) * S.perMo; }

  return (F.gaFuture || []).filter(g => g[5] > now && g[4] <= lim).sort((a, b) => a[4] - b[4]).map(g => ({ id: g[0], name: g[1], ceil: g[2], type: g[3], s: g[4], e: g[5], pu: (g[6] || []).map(c => ({ id: c[0], ch: c[1], rar: c[2], abn: c[3], attr: c[4], sk: c[5] })), ev: g[7], src: g[9], conf: g[10], meta: g[13] }));

  return rows;
}
function pOne(pulls, k) { const p = 0.004; return 1 - Math.pow(1 - p * (k || 1), pulls); }
function fd(t) { const d = new Date(t); return (d.getMonth() + 1) + '/' + d.getDate(); }

  const endT = now + S.months * 30.5 * DAY, endHave = S.free + S.paid + income(endT) - picked.reduce((s, r) => s + r.need, 0);
  const miss = S.own ? rows.filter(r => r.pu.some(c => !S.own.has(c.id))).length : null;
  $('#sumN').textContent = S.months + ' 個月・' + rows.length + ' 池' + (evs.length ? '・' + evs.filter(e => e <= endT).length + ' 期活動入帳' : '');
  $('#tiles').innerHTML = [['現在可抽', n(Math.floor((S.free + S.paid) / 300) + S.ticket) + ' 抽', '水晶 ' + n(S.free + S.paid) + '＋券 ' + S.ticket], [S.months + ' 個月後預估', n(Math.max(0, Math.round(endHave))) + ' 顆', '扣掉想抽的 ' + n(totalNeed) + ' 顆'], ['想抽', picked.length + ' 池', totalPulls + ' 抽・' + n(totalNeed) + ' 顆'], ['不夠的池', bad.length + ' 池', bad.length ? '第一個：' + esc(bad[0].name) + '（' + fd(bad[0].s) + '）' : '照這個計畫都夠'], ...(miss != null ? [['有缺 PU 卡的池', miss + ' 池', '持卡 ' + S.own.size + ' 張']] : [])]
    .map(x => '<div class="tile"><span>' + x[0] + '</span><b>' + x[1] + '</b><small>' + x[2] + '</small></div>').join('');
  drawChart(rows, endT);
  const filt = S.filt, show = rows.filter(r => filt === 'all' ? true : filt === 'picked' ? r.pulls > 0 : filt === 'miss' ? (S.own && r.pu.some(c => !S.own.has(c.id))) : ['pickup', 'rerun', 'select', 'fes', 'wl', 'newyear', 'anniv', 'birthday'].includes(r.type));
  $('#listN').textContent = show.length + '／' + rows.length + ' 池';
  $('#list').innerHTML = show.map(r => {
    const puH = r.pu.length ? '<div class="pu">' + r.pu.map(c => { const own = S.own && S.own.has(c.id); const cd = CARD[c.id]; return '<span class="c ' + (own ? 'own' : S.own ? 'miss' : '') + '" title="' + esc((cd && cd[7]) || '') + '"><img src="' + ASSET + '/thumbnail/chara/' + c.abn + '_normal.webp" alt="" loading="lazy"><span><b>' + esc((CH[c.ch] || {}).name || '#' + c.ch) + '</b><br><span class="dim" style="font-size:10.5px">' + (c.rar === 9 ? '生日' : '★' + c.rar) + (ATTR[c.attr] ? '・' + ATTR[c.attr] : '') + (SK[c.sk] ? '・' + SK[c.sk] : '') + '</span></span></span>'; }).join('') + '</div>' : (r.meta ? '<div class="note">' + (r.meta[2] === 'event' ? '活動卡池（日服未公布，角色與屬性為推估）' : '') + '</div>' : '');
    const missN = S.own ? r.pu.filter(c => !S.own.has(c.id)).length : null;
    const ceil = r.type === 'birthday' ? 100 : 300, k = Math.max(1, r.pu.length);
    const proj = '<div class="proj">到這天預估有 <b>' + n(Math.max(0, Math.round(r.have))) + '</b> 顆＝可抽 <b>' + n(r.afford) + '</b> 抽' + (r.pulls ? '<br>計畫 ' + r.pulls + ' 抽要 ' + n(r.need) + ' 顆：<b class="' + (r.ok ? 'ok' : 'bad') + '">' + (r.ok ? '夠，抽完剩 ' + n(Math.max(0, Math.round(r.after))) : '差 ' + n(Math.round(-r.after))) + '</b>' + (r.pu.length ? '<br>至少中 1 張指定 PU：' + (pOne(r.pulls) * 100).toFixed(1) + '%' + (k > 1 ? '・任一 PU ' + (pOne(r.pulls, k) * 100).toFixed(1) + '%' : '') : '') + (r.pulls >= ceil ? '<br><b class="ok">已到天井，可換 PU 卡</b>' : '') : '') + '</div>';
    const quick = [10, 50, 100, ceil].map(v => '<button class="btn sm" data-g="' + r.id + '" data-v="' + v + '">' + (v === ceil ? '天井 ' + v : v) + '</button>').join('');
    return '<div class="g' + (r.pulls ? '' : '') + '" id="g' + r.id + '"><div class="dt"><b>' + fd(r.s) + '</b>' + Math.ceil((r.s - now) / DAY) + ' 天後<br>' + fd(r.s) + ' – ' + fd(r.e) + '</div>' +
      '<div><div class="nm">' + esc(r.name) + '</div><div class="row" style="margin-top:4px;gap:6px"><span class="chip">' + (TYPE[r.type] || r.type) + '</span>' + (LIMITED.has(r.type) ? '<span class="chip" style="background:var(--acc-soft);color:var(--acc-2)">限定</span>' : '') + '<span class="chip src-' + r.src + '">' + (r.src === 'tw' ? '官方已排' : r.src === 'pred' ? '模型預測' : '日服未公布・推估') + '</span>' + (missN != null && r.pu.length ? '<span class="chip" style="' + (missN ? 'color:var(--acc-2)' : 'color:var(--ok)') + '">' + (missN ? '缺 ' + missN + ' 張' : '全部都有') + '</span>' : '') + '</div>' + puH + '</div>' +
      '<div class="pl"><div class="row"><label class="f" style="flex-direction:row;align-items:center;gap:6px">想抽<input type="number" min="0" max="1000" value="' + r.pulls + '" data-g="' + r.id + '" class="pulls" aria-label="計畫抽數"> 抽</label></div><div class="row">' + quick + '<button class="btn sm" data-g="' + r.id + '" data-v="0">不抽</button></div>' + proj + '</div></div>';
  }).join('') || '<div class="empty">這個篩選沒有卡池。</div>';
  $$('#list .pulls').forEach(i => i.onchange = () => { const v = Math.max(0, +i.value || 0); if (v) S.picks[i.dataset.g] = v; else delete S.picks[i.dataset.g]; save(); render(); });
  $$('#list .btn[data-v]').forEach(b => b.onclick = () => { const v = +b.dataset.v; if (v) S.picks[b.dataset.g] = v; else delete S.picks[b.dataset.g]; save(); render(); });
}
function drawChart(rows, endT) {
  const W = 800, H = 170, pad = { l: 46, r: 10, t: 12, b: 22 }; const pts = []; let spent = 0; const picks = rows.filter(r => r.pulls).sort((a, b) => a.s - b.s);
  const steps = 120; for (let i = 0; i <= steps; i++) { const t = now + (endT - now) * i / steps; while (picks.length && picks[0].s <= t) { spent += picks.shift().need; } pts.push([t, S.free + S.paid + income(t) - spent]); }
  rows.filter(r => r.pulls).forEach(r => { const before = S.free + S.paid + income(r.s) - rows.filter(x => x.pulls && x.s < r.s).reduce((s, x) => s + x.need, 0); pts.push([r.s - 1, before], [r.s, before - r.need]); });
  pts.sort((a, b) => a[0] - b[0]);
  const ys = pts.map(p => p[1]), maxY = Math.max(300, ...ys), minY = Math.min(0, ...ys); const x = t => pad.l + (t - now) / (endT - now) * (W - pad.l - pad.r), y = v => pad.t + (maxY - v) / (maxY - minY || 1) * (H - pad.t - pad.b);
  let d = ''; pts.forEach((p, i) => d += (i ? 'L' : 'M') + x(p[0]).toFixed(1) + ' ' + y(p[1]).toFixed(1) + ' ');
  const span = (maxY - minY) || 1, raw = span / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), step = [1, 2, 5, 10].map(m => m * mag).find(v => v >= raw) || mag;
  const grid = []; for (let v = Math.ceil(minY / step) * step; v <= maxY; v += step) grid.push(v);
  const months = []; for (let t = now; t <= endT; t += 30.5 * DAY) months.push(t);
  $('#chart').innerHTML = grid.map(v => '<line x1="' + pad.l + '" x2="' + (W - pad.r) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="currentColor" stroke-opacity=".12"/><text x="' + (pad.l - 4) + '" y="' + (y(v) + 4) + '" font-size="10" text-anchor="end" fill="currentColor" fill-opacity=".6">' + (v >= 1000 ? Math.round(v / 1000) + 'k' : v) + '</text>').join('') +
    months.map(t => '<text x="' + x(t) + '" y="' + (H - 6) + '" font-size="10" text-anchor="middle" fill="currentColor" fill-opacity=".6">' + fd(t) + '</text>').join('') +
    '<line x1="' + pad.l + '" x2="' + (W - pad.r) + '" y1="' + y(0) + '" y2="' + y(0) + '" stroke="currentColor" stroke-opacity=".4"/>' +
    '<path d="' + d + '" fill="none" stroke="var(--acc)" stroke-width="2.5" vector-effect="non-scaling-stroke"/>' +
    rows.filter(r => r.pulls).map(r => '<circle cx="' + x(r.s) + '" cy="' + y(r.after) + '" r="4" fill="' + (r.ok ? 'var(--acc)' : 'var(--bad)') + '"><title>' + esc(r.name) + ' ' + r.pulls + ' 抽</title></circle>').join('');
}
