name = "pjsk-games"
main = "src/index.js"

# 2024-04-29 之後 brotli_content_encoding 預設開啟，向來源要 br 才拿得到 14KB
# （不設的話 Workers 會覆寫外送的 Accept-Encoding，退回 gzip 26KB）。
compatibility_date = "2026-06-01"

# Durable Object：整個抓取迴圈住在這裡（單例）
[[durable_objects.bindings]]
name = "TRACKER"
class_name = "GameTracker"

# 免費方案只支援 SQLite backend；付費也用同一套，遷移標籤要用 new_sqlite_classes
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameTracker"]

# 看門狗：alarm 失敗只會重試 6 次，鏈斷了就永遠不再跑。
# 每分鐘來敲一次，沒排程就把它重新排起來。
[triggers]
crons = ["* * * * *"]

# 自訂網域：只吃 games 子網域，主網域留給網站本體（之後要把主站從 Vercel 搬過來也不受影響）。
# custom_domain = true 會自動在該 zone 建立 DNS 記錄並簽發憑證。
[[routes]]
pattern = "games.project-sekai-center.com"
custom_domain = true

# D1：使用者、設定、偵測訂閱、事件、管理員稽核
[[d1_databases]]
binding = "DB"
database_name = "pjsk-users"
database_id = "63ad1759-8919-4ed5-aa88-0b4c31e347ae"

# 非機密設定。機密（GOOGLE_CLIENT_SECRET / DISCORD_CLIENT_SECRET /
# RESEND_API_KEY / ANTHROPIC_API_KEY / SESSION_SECRET）一律用
# `wrangler secret put <NAME>`，不要寫進這個檔案（它會進 git）。
[vars]
SITE_BASE = "https://project-sekai-center.com"
OAUTH_BASE = "https://games.project-sekai-center.com"
COOKIE_DOMAIN = ".project-sekai-center.com"
# AI 每日呼叫上限。實測每次約 $0.14（in 約 2 萬 tokens、out 約 1.4 千）,
# 調整前請先換算：400 次 ≈ $55／人／日（快取後約 $42）。AI_CAP_SITE 是全站保護網,
# 因為帳戶餘額是共用的,個人上限擋不住多人同時用滿。
# 換模型不必改程式碼。sonnet-5 $2/$10、opus-4.8 與 opus-5 都是 $5/$25 per MTok。
AI_MODEL = "claude-opus-5"
AI_CAP_USER = "400"
AI_CAP_ADMIN = "2000"
AI_CAP_SITE = "1500"
MAIL_FROM = "SEKAI 資源中心 <noreply@project-sekai-center.com>"

# 申請自動審核。
# AI_REVIEW_MODEL 跟站內助手分開:這裡只是判斷一句話是不是廣告或亂填,
# 不需要助手那種要查表、要交叉比對的能力,而它是每個申請者都會觸發一次的。
# AUTO_APPROVE 預設關閉。開啟後也只有「通過遊戲內驗證碼、證明帳號真的是自己的」
# 申請才可能自動核准 —— 沒有那道驗證,所有檢查都能靠抄一個公開榜單上的 id 通過。
# AI_CAP_AUTO 是自動核准帳號的試用額度:自動審核再嚴謹也可能誤放行,
# 而以 AI_CAP_USER=400 計,誤放行一個帳號當天最多能燒掉 $55;壓在 20 次就是 $3,
# 等管理員事後覆核(在後台按核准，reviewed_by 就會變成他)才升到正常額度。
AI_REVIEW_MODEL = "claude-haiku-4-5-20251001"
# 已開啟(2026-08-29,站主要求「等級一致就通過」)。實際能走到自動核准的,
# 必須同時滿足:帳號存在、通過遊戲內驗證碼的所有權驗證、沒有已證明的重複、
# 申請填的等級與 API 回報的差 5 級以內、自由文字沒藏不可見字元、AI 沒標記。
# 任何一項不成立都退回人工,而且永遠不會自動「拒絕」。
AUTO_APPROVE = "1"
AI_CAP_AUTO = "20"

# AI 點數方案（beta）。預設關閉 —— 開之前請先設定 PAY_INSTRUCTIONS，
# 否則使用者會下了單卻不知道錢要匯到哪裡。
# 定價基準是實測成本:每次助手呼叫平均 in 約 20,700 / out 約 1,400 tokens，
# 以 Opus 5 的 $5/$25 per MTok 計約 US$0.1385，換算約 NT$4.4。
# **單價低於 4.4 就是每賣一點虧一點。** 預設方案是 6.0 / 5.0 / 4.5 元一點。
# 要改方案不必動程式碼，設 AI_PLANS 為 JSON 陣列即可，例如：
#   AI_PLANS = '[{"id":"std","name":"標準包","points":200,"price":1000}]'
CREDITS_BETA = "0"
PAY_INSTRUCTIONS = ""

[observability]
enabled = true
