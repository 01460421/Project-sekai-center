name = "pjsk-bot"
main = "src/worker.js"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# 單例 Durable Object：玩家資料、伺服器設定、進行中的遊戲都在裡面；所有互動排隊處理，沒有競態
[[durable_objects.bindings]]
name = "BOT"
class_name = "BotDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BotDO"]

# 每分鐘：提醒、倒數、抽獎自動開獎
[triggers]
crons = ["* * * * *"]

# 自訂網域（選用）：不設就用 pjsk-bot.<你的子網域>.workers.dev。
# 注意 bot.project-sekai-center.com 已被菜根機器人的隧道使用，這裡用別的子網域。
# [[routes]]
# pattern = "discord.project-sekai-center.com"
# custom_domain = true

# 非機密設定。機密一律 `wrangler secret put <NAME>`：
#   DISCORD_TOKEN        Bot token
#   DISCORD_PUBLIC_KEY   開發者後台 General Information 的 Public Key（驗簽用，沒有它所有請求都會被拒）
#   APP_ID               Application ID
#   REGISTER_SECRET      自訂一串隨機字，POST /register 註冊指令時當 Bearer token
#   ANTHROPIC_API_KEY    選用，占卜／測驗的 AI 解讀
[vars]
AI_MODEL = "claude-opus-5"
AI_DAILY_PER_USER = "10"

[observability]
enabled = true
