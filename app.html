<style>
:root{
--bg:#eef1f9;--bg-soft:#f6f8fd;--card:#fff;--card-2:#f1f4fb;
--text:#3c455f;--text-2:#6d7691;--text-3:#8b93ac;--ink:#252e4d;
--accent:#0eb3c5;--accent-deep:#0891a2;
--border:rgba(72,86,133,.13);--border-2:rgba(72,86,133,.26);
--cta:linear-gradient(135deg,#22c3d6 0%,#3f8cf3 100%);
--ink-grad:linear-gradient(135deg,#273052 0%,#3b4878 100%);
--grad-cta:linear-gradient(135deg,#22c3d6 0%,#3f8cf3 100%);
--rainbow:linear-gradient(90deg,#4ad1e8,#3ee0a8,#b8e561,#ffd94d,#ff9db4,#c39df2,#7fb4f7);
--sh-xs:0 1px 2px rgba(31,42,80,.05);
--sh-sm:0 1px 2px rgba(31,42,80,.04),0 4px 14px rgba(31,42,80,.06);
--sh-md:0 2px 6px rgba(31,42,80,.06),0 12px 32px rgba(31,42,80,.11);
--sh-lg:0 8px 20px rgba(31,42,80,.10),0 28px 70px rgba(31,42,80,.2);
--fes-bg:#fff3d4;--fes-fg:#b07500;--lim-bg:#ffe4ec;--lim-fg:#d6336c;
--paid-bg:#fdf7d8;--paid-fg:#9c8300;--bd-bg:#f3e8ff;--bd-fg:#9c53d6;
--rr-bg:#ffe3de;--rr-fg:#d64533;--wl-bg:#def0ff;--wl-fg:#2277cc;
--nm-bg:#def5e6;--nm-fg:#2f9e57;--ot-bg:#edf0f7;--ot-fg:#5d6884;
--anim:.5s;
/* 告訴瀏覽器原生控制項(select 的下拉、option 文字、日期選擇器…)該用哪一種配色。
   prefers-color-scheme 只是「偵測」系統偏好,color-scheme 才是「宣告」。
   沒有它的話,深色主題下 Safari 會用淺色畫 select 的選項文字,
   跟我們的深色背景撞在一起,整個下拉看起來就是空白的。 */
color-scheme:light;
}
:root.theme-light{color-scheme:light;}
/* 深色變數:跟隨系統(未手動指定淺色時)＋手動指定深色,兩者共用同一組值 */
@media (prefers-color-scheme:dark){:root:not(.theme-light){
color-scheme:dark;
--bg:#0c0f1d;--bg-soft:#101529;--card:#161b31;--card-2:#1d2340;
--text:#ccd3e8;--text-2:#a2abc9;--text-3:#8a93b2;--ink:#eef1fc;
--accent:#33cfe0;--accent-deep:#5fd0e6;
--border:rgba(148,163,215,.17);--border-2:rgba(148,163,215,.32);
--ink-grad:linear-gradient(135deg,#232b4e 0%,#39456f 100%);
--grad-cta:linear-gradient(135deg,#f08fae 0%,#c8628f 100%);
--sh-xs:0 1px 2px rgba(0,0,0,.25);--sh-sm:0 1px 2px rgba(0,0,0,.2),0 4px 14px rgba(0,0,0,.25);
--sh-md:0 2px 6px rgba(0,0,0,.25),0 12px 32px rgba(0,0,0,.35);--sh-lg:0 8px 20px rgba(0,0,0,.35),0 28px 70px rgba(0,0,0,.5);
--fes-bg:#33270a;--fes-fg:#ffd15c;--lim-bg:#3a1220;--lim-fg:#ff8fb5;
--paid-bg:#332d08;--paid-fg:#ffe066;--bd-bg:#2a1440;--bd-fg:#d0a5ff;
--rr-bg:#3a1510;--rr-fg:#ff9d8a;--wl-bg:#0d2440;--wl-fg:#7cc0ff;
--nm-bg:#0d2e1a;--nm-fg:#69dd95;--ot-bg:#1d2338;--ot-fg:#9aa5c5;
}}
:root.theme-dark{
color-scheme:dark;
--bg:#0c0f1d;--bg-soft:#101529;--card:#161b31;--card-2:#1d2340;
--text:#ccd3e8;--text-2:#a2abc9;--text-3:#8a93b2;--ink:#eef1fc;
--accent:#33cfe0;--accent-deep:#5fd0e6;
--border:rgba(148,163,215,.17);--border-2:rgba(148,163,215,.32);
--ink-grad:linear-gradient(135deg,#232b4e 0%,#39456f 100%);
--grad-cta:linear-gradient(135deg,#f08fae 0%,#c8628f 100%);
--sh-xs:0 1px 2px rgba(0,0,0,.25);--sh-sm:0 1px 2px rgba(0,0,0,.2),0 4px 14px rgba(0,0,0,.25);
--sh-md:0 2px 6px rgba(0,0,0,.25),0 12px 32px rgba(0,0,0,.35);--sh-lg:0 8px 20px rgba(0,0,0,.35),0 28px 70px rgba(0,0,0,.5);
--fes-bg:#33270a;--fes-fg:#ffd15c;--lim-bg:#3a1220;--lim-fg:#ff8fb5;
--paid-bg:#332d08;--paid-fg:#ffe066;--bd-bg:#2a1440;--bd-fg:#d0a5ff;
--rr-bg:#3a1510;--rr-fg:#ff9d8a;--wl-bg:#0d2440;--wl-fg:#7cc0ff;
--nm-bg:#0d2e1a;--nm-fg:#69dd95;--ot-bg:#1d2338;--ot-fg:#9aa5c5;
}
/* ===== 六種配色風格（藝術典雅）：只覆蓋強調色系，底色與對比交給深/淺色主題 ===== */
:root.tone-sakura{--accent:#e06a92;--accent-deep:#c24b76;
  --cta:linear-gradient(135deg,#f08fae 0%,#c8628f 100%);
  --rainbow:linear-gradient(90deg,#f3b6c8,#e8879f,#d97b96,#c98aa8,#e3aec0,#f0cbd6,#f3b6c8);}
:root.tone-jade{--accent:#2fa98d;--accent-deep:#1f8770;
  --cta:linear-gradient(135deg,#4cbfa2 0%,#268f86 100%);
  --rainbow:linear-gradient(90deg,#a8dcc9,#6fc7ae,#43ab97,#54b9a6,#8fd0bd,#c2e5d7,#a8dcc9);}
:root.tone-wisteria{--accent:#8a72c8;--accent-deep:#6f56ad;
  --cta:linear-gradient(135deg,#a48ada 0%,#7659b8 100%);
  --rainbow:linear-gradient(90deg,#cfc2ea,#ab95dc,#8f77cc,#a086d4,#c0aee4,#ded3f0,#cfc2ea);}
:root.tone-amber{--accent:#c98a2e;--accent-deep:#a86f1c;
  --cta:linear-gradient(135deg,#e0a44a 0%,#b87a26 100%);
  --rainbow:linear-gradient(90deg,#f0d5a8,#e0b56f,#cf9a45,#d9a955,#ebc98f,#f5e3c2,#f0d5a8);}
:root.tone-ink{--accent:#4a6da8;--accent-deep:#35548a;
  --cta:linear-gradient(135deg,#6485bb 0%,#3c5c95 100%);
  --rainbow:linear-gradient(90deg,#b6c6de,#8aa3c8,#5f7fb0,#7391bd,#a3b8d5,#cdd8e8,#b6c6de);}
/* 深色模式下強調色要提亮，accent-deep 需比 accent 更亮才有對比 */
:root.theme-dark.tone-sakura{--accent:#f2a0bb;--accent-deep:#f8c2d3;}
@media (prefers-color-scheme:dark){:root:not(.theme-light).tone-sakura{--accent:#f2a0bb;--accent-deep:#f8c2d3;}}
:root.theme-dark.tone-jade{--accent:#4fd0b0;--accent-deep:#7fe0c8;}
@media (prefers-color-scheme:dark){:root:not(.theme-light).tone-jade{--accent:#4fd0b0;--accent-deep:#7fe0c8;}}
:root.theme-dark.tone-wisteria{--accent:#b09ae6;--accent-deep:#cbbcf2;}
@media (prefers-color-scheme:dark){:root:not(.theme-light).tone-wisteria{--accent:#b09ae6;--accent-deep:#cbbcf2;}}
:root.theme-dark.tone-amber{--accent:#e8b866;--accent-deep:#f2d09a;}
@media (prefers-color-scheme:dark){:root:not(.theme-light).tone-amber{--accent:#e8b866;--accent-deep:#f2d09a;}}
:root.theme-dark.tone-ink{--accent:#86a8de;--accent-deep:#aec7ec;}
@media (prefers-color-scheme:dark){:root:not(.theme-light).tone-ink{--accent:#86a8de;--accent-deep:#aec7ec;}}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
font-family:'Huninn','M PLUS Rounded 1c','PingFang TC','Microsoft JhengHei','Noto Sans TC',sans-serif}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
background:radial-gradient(900px 520px at 88% -140px,rgba(84,190,255,.1),transparent 60%),radial-gradient(820px 480px at -8% 4%,rgba(57,197,187,.09),transparent 60%),radial-gradient(700px 520px at 60% 112%,rgba(255,151,190,.07),transparent 60%)}
a{color:var(--accent-deep);text-decoration:none}
a:hover{color:var(--accent);text-decoration:underline}
input,select,button,textarea{font-family:inherit}
input::placeholder{color:var(--text-3)}
::selection{background:rgba(34,195,214,.28)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:8px;border:2.5px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:3px solid rgba(14,179,197,.45);outline-offset:2px;border-radius:10px}
@keyframes pageIn{from{opacity:0}to{opacity:1}}
@keyframes riseIn{from{opacity:0}to{opacity:1}}
@keyframes rainbowPan{to{background-position:220% 0}}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes popIn{from{opacity:0;transform:scale(.95) translateY(12px)}to{opacity:1;transform:none}}
@keyframes sheetUp{from{transform:translateY(103%)}to{transform:none}}
@keyframes popCenter{from{opacity:0;transform:translate(-50%,-46%) scale(.96)}to{opacity:1;transform:translate(-50%,-50%)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media (max-width:900px){main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}}

/* 圖表容器整塊關閉選取與長按選單：長按跳出的複製／查詢選單
   來自圖表周圍的文字（起迄、縱軸說明），不只 SVG 本身。 */
*:has(> svg[data-chart]),*:has(> svg[data-chart]) *{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}

/* 側欄項目變多後會超出畫面，給它自己的捲軸；細一點免得太搶眼 */
.side-nav{scrollbar-width:thin;scrollbar-color:var(--border-2) transparent}
.side-nav::-webkit-scrollbar{width:8px}
.side-nav::-webkit-scrollbar-track{background:transparent}
.side-nav::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:999px;border:2px solid transparent;background-clip:content-box}
.side-nav::-webkit-scrollbar-thumb:hover{background:var(--text-3);border:2px solid transparent;background-clip:content-box}

/* 教學內文:原檔的表格與清單需要基本樣式,不然數值表會擠成一團。
   表格的捲動要由 table 這層當捲動容器(display:block),但那樣 table 就不再是
   table 佈局、各列的欄寬會各自為政 —— 這是手機上「格式跑掉」的真正原因。
   解法:外層 block 只負責捲動,內層 tbody 改回 display:table 保住欄寬對齊。 */
.tut-a table{border-collapse:collapse;margin:10px 0;font-size:12.5px;display:block;overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
.tut-a table>tbody,.tut-a table>thead{display:table;min-width:100%}
.tut-a td,.tut-a th{border:1px solid var(--border);padding:6px 11px;text-align:center;color:var(--text);white-space:nowrap}
.tut-a tr:first-child td,.tut-a th{background:var(--card-2);font-weight:800;color:var(--ink)}
@media(max-width:900px){
  /* 手機:字與內距縮一點,多擠一兩欄進畫面;第一欄釘住,橫捲時才知道每列是什麼 */
  .tut-a table{font-size:11.5px}
  .tut-a td,.tut-a th{padding:5px 8px}
  .tut-a td:first-child,.tut-a th:first-child{position:sticky;left:0;z-index:1;background:var(--card)}
  .tut-a tr:first-child td:first-child,.tut-a th:first-child{background:var(--card-2)}
}
.tut-a td p{margin:0}
.tut-a ul,.tut-a ol{margin:8px 0 8px 20px;padding:0}
.tut-a li{margin:3px 0}
.tut-a p{margin:7px 0}
.tut-a a{color:var(--accent-deep);font-weight:700}
.tut-a img{max-width:100%;height:auto;border-radius:10px;display:block;margin:8px 0}

/* 原生 select 在 Safari 深色下的老問題：即使宣告了 color-scheme,
   只要在 select 上蓋自訂的 background/color,下拉展開時的選項清單仍可能
   沿用系統配色而看不見文字。與其賭各家瀏覽器的實作,不如把 option 的顏色
   直接寫死 —— 這是少數需要明確指定、不能只靠繼承的地方。
   select 本身保留自訂外觀(要跟其他輸入框一致),展開後的清單交給這兩行保底。 */
select{ color:var(--text); background-color:var(--card); }
select option, select optgroup{
  color:var(--text);
  background-color:var(--card);
}
/* 手動深色時 option 也要跟著,否則系統是淺色、站上是深色的組合會反過來看不見 */
:root.theme-dark select option{ color:#ccd3e8; background-color:#161b31; }
:root.theme-light select option{ color:#2b3350; background-color:#ffffff; }
</style>
</helmet>

<div style="position:relative;z-index:1;min-height:100dvh;display:flex;align-items:stretch;font:400 14.5px/1.7 'Huninn','M PLUS Rounded 1c','PingFang TC','Microsoft JhengHei',sans-serif;color:var(--text)">

            <button type="button" onClick="{{ onDeckDetail }}" style="padding:7px 15px;border:1px solid var(--border);border-radius:999px;background:var(--card);color:var(--text-2);font-size:12px;font-weight:700;cursor:pointer">編組詳情</button>

        </sc-if>
        <sc-if value="{{ noPlayer }}">
          <div style="font-size:13px;color:var(--text-2);margin-bottom:12px;line-height:1.7">綁定遊戲內 Player ID，首頁就會顯示你的排名與進度（只存在這台裝置）。</div>

            <input type="text" inputmode="numeric" placeholder="Player ID（純數字）" value="{{ pidInput }}" onInput="{{ onField }}" data-k="pidInput" style="flex:1;min-width:150px;padding:10px 14px;border:1.5px solid var(--border);border-radius:13px;background:var(--card);color:var(--text);font-size:14px;min-height:42px;outline:none" style-focus="border-color:var(--accent)">
            <button type="button" onClick="{{ onBind }}" style="padding:10px 22px;border:none;border-radius:999px;background:var(--cta);color:#fff;font-size:13.5px;font-weight:800;cursor:pointer;box-shadow:0 5px 16px rgba(37,125,220,.28);transition:transform .28s cubic-bezier(.34,1.45,.44,1)" style-active="transform:scale(.96)">綁定</button>

          <button type="button" onClick="{{ onGo }}" data-p="deckpro" style="padding:6px 13px;border:1px solid var(--border);border-radius:999px;background:var(--card);color:var(--text-2);font-size:12px;font-weight:700;cursor:pointer">進階</button>

    <sc-if value="{{ homeShow.gacha }}">

  <!-- ========== 日曆 ========== -->
  <sc-if value="{{ isCalendar }}">
  <div style="animation:pageIn var(--anim) cubic-bezier(.32,.72,.24,1)">

      <div style="display:flex;gap:7px">
        <button type="button" onClick="{{ onMonth }}" data-d="-1" style="padding:8px 15px;border:1px solid var(--border);border-radius:999px;background:var(--card);color:var(--text);font-size:12.5px;font-weight:700;cursor:pointer;box-shadow:var(--sh-xs);transition:transform .25s cubic-bezier(.34,1.45,.44,1)" style-active="transform:scale(.94)">◀ 上月</button>

        <button type="button" onClick="{{ onMonth }}" data-d="1" style="padding:8px 15px;border:1px solid var(--border);border-radius:999px;background:var(--card);color:var(--text);font-size:12.5px;font-weight:700;cursor:pointer;box-shadow:var(--sh-xs);transition:transform .25s cubic-bezier(.34,1.45,.44,1)" style-active="transform:scale(.94)">下月 ▶</button>

      <sc-for list="{{ typeLegend }}" as="t" hint-placeholder-count="7">

    <div style="border:1px solid var(--border);border-radius:20px;padding:16px;background:var(--card);box-shadow:var(--sh-sm)">

            <sc-if value="{{ isMobile }}">

    <sc-if value="{{ hasDaySel }}">
      <div style="margin-top:14px;border:1px solid var(--border);border-radius:20px;padding:18px;background:var(--card);box-shadow:var(--sh-sm);animation:riseIn .4s cubic-bezier(.32,.72,.24,1)">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px">
          <div style="font-size:14.5px;font-weight:800;color:var(--ink);font-family:'M PLUS Rounded 1c'">{{ daySelLabel }}</div>
          <button type="button" onClick="{{ onDayClose }}" aria-label="關閉" style="width:30px;height:30px;display:grid;place-items:center;border:none;border-radius:50%;background:var(--card-2);color:var(--text-2);font-size:16px;cursor:pointer">×</button>

          <sc-for list="{{ dayEvents }}" as="e" hint-placeholder-count="2">

            <span>名次</span>
            <sc-for list="{{ trendHead }}" as="h" hint-placeholder-count="6"><span style="text-align:right">{{ h.n }}</span></sc-for>
            <span style="text-align:right">與上期</span>
          </div>
          <sc-for list="{{ trendRows }}" as="r" hint-placeholder-count="9">
            <div style="display:grid;grid-template-columns:{{ trendCols }};gap:8px;padding:10px 14px;border-top:1px solid var(--border);align-items:center">
              <span style="font-family:'M PLUS Rounded 1c';font-size:12.5px;font-weight:800;color:var(--accent-deep)">{{ r.tier }}</span>
              <sc-for list="{{ r.cells }}" as="c" hint-placeholder-count="6"><span style="text-align:right;font-family:'M PLUS Rounded 1c';font-size:12.5px;color:var(--ink)">{{ c.v }}</span></sc-for>
              <span style="text-align:right;font-family:'M PLUS Rounded 1c';font-size:11.5px;font-weight:700;color:{{ r.diffColor }}">{{ r.diff }}</span>

          </sc-for>
        </div>
      </div>
      <div style="font-size:11.5px;color:var(--text-3);margin-top:10px;line-height:1.7">每欄為一期活動（左為最新）。數值＝該期最終衝到該名次所需的活動 P；「與上期」為最新一期相對前一期的增減。</div>
      <!-- 這裡只做「各期 × 各段位」的對照表；想按活動長度、團體、類型交叉篩選的話，
           good果汁那份表做得比這裡完整，直接指過去比自己重做一個半吊子的好。 -->
      <a href="https://docs.google.com/spreadsheets/d/1GrB74wgDgJyRe_lNKpwWHjXrnCYOZP9M8L9uuQHJafA/edit?usp=sharing" target="_blank" rel="noopener" style="display:block;margin-top:11px;padding:12px 15px;border:1px solid var(--border);border-radius:14px;background:var(--card-2);text-decoration:none">
        <div style="font-size:13px;font-weight:800;color:var(--accent-deep)">想做更細的交叉篩選？台服全榜線紀錄 ↗</div>
        <div style="font-size:11.5px;color:var(--text-3);margin-top:3px;line-height:1.6">good果汁製作。含活動一覽與各期排行，可依活動長度／團體／類型自行篩選與客製化（例如「時長 8.25、9.25 天的 wxs 箱活 T1000 排行」）。原表的篩選器需要電腦版才能操作，手機仍可檢視；站上的「榜線資料庫」則是手機也能篩。</div>
      </a>
    </sc-if>

    <div style="font-size:11.5px;color:var(--text-3);margin-top:10px;line-height:1.7">資料來源：HiSekai API（台服）。連線被瀏覽器阻擋時會自動改走公開代理重試。</div>
  </div>
  </sc-if>

  <!-- ========== 計算中心 ========== -->
  <sc-if value="{{ isCalc }}">
  <div style="animation:pageIn var(--anim) cubic-bezier(.32,.72,.24,1)">

    <div style="border:1px solid var(--border);border-radius:20px;padding:18px;background:var(--card);box-shadow:var(--sh-sm);margin-bottom:14px">

        <div style="display:flex;flex-wrap:wrap;gap:7px">
          <sc-for list="{{ presets }}" as="p" hint-placeholder-count="3">

      </div>
      <div style="font-size:11px;color:var(--text-3);margin-bottom:11px;line-height:1.6">此處「技能倍率」＝<b>時效值</b>（單次全隊技能總倍率，<b>不得大於 2.88</b>）。單張卡單次技能 20%～160%，滿隊整隊上限 ×2.88。</div>

          <input type="text" placeholder="曲名關鍵字…" value="{{ epq }}" onInput="{{ onField }}" data-k="epq" style="width:100%;padding:9px 14px;border:1.5px solid var(--border);border-radius:12px;background:var(--card);color:var(--text);font-size:14px;min-height:42px;outline:none" style-focus="border-color:var(--accent)"></label>
        <label style="display:block"><span style="display:block;font-size:11.5px;font-weight:700;color:var(--text-2);margin-bottom:4px">選曲 · 係數 R{{ songRate }} · {{ songTime }}s</span>
          <select value="{{ songKey }}" onChange="{{ onField }}" data-k="songKey" data-num="1" style="width:100%;padding:9px 13px;border:1.5px solid var(--border);border-radius:12px;background:var(--card);color:var(--text);font-size:13.5px;min-height:42px;cursor:pointer;outline:none">
            <sc-for list="{{ songOptions }}" as="o" hint-placeholder-count="6"><option value="{{ o.v }}">{{ o.n }}</option></sc-for>
          </select></label>
        <sc-if value="{{ epEmpty }}">
          <button type="button" onClick="{{ onReloadEp }}" style="margin-top:8px;width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:12px;background:var(--card-2);color:var(--accent);font-size:12.5px;font-weight:700;cursor:pointer">{{ epMsg }}</button>
        </sc-if>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:13px">
        <sc-for list="{{ diffChips }}" as="d" hint-placeholder-count="6">
          <button type="button" onClick="{{ onSet }}" data-k="diff" data-v="{{ d.v }}" disabled="{{ d.dis }}" style="display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border:1px solid {{ d.bd }};border-radius:999px;background:{{ d.bg }};color:{{ d.fg }};font-size:11.5px;font-weight:800;letter-spacing:.6px;cursor:{{ d.cur }};opacity:{{ d.op }};box-shadow:var(--sh-xs);transition:transform .25s cubic-bezier(.34,1.45,.44,1)" style-active="transform:scale(.94)">
            <span style="width:8px;height:8px;border-radius:3px;background:{{ d.c }}"></span>{{ d.n }}<span style="font-family:'M PLUS Rounded 1c';opacity:.75">{{ d.lv }}</span>
          </button>
        </sc-for>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px">
        <sc-for list="{{ sharedFields }}" as="f" hint-placeholder-count="4">
          <label style="display:block"><span style="display:block;font-size:11.5px;font-weight:700;color:var(--text-2);margin-bottom:4px">{{ f.label }}</span>
            <input type="number" value="{{ f.value }}" onInput="{{ onField }}" data-k="{{ f.k }}" data-num="1" style="width:100%;padding:9px 13px;border:1.5px solid var(--border);border-radius:12px;background:var(--card);color:var(--text);font-size:14px;min-height:42px;outline:none;font-family:'M PLUS Rounded 1c';font-weight:700" style-focus="border-color:var(--accent)"></label>
        </sc-for>
      </div>
      <div style="display:grid;grid-template-columns:{{ twoCol }};gap:14px;margin-top:13px">
        <div>
          <span style="display:block;font-size:11.5px;font-weight:700;color:var(--text-2);margin-bottom:6px">消耗體力（ライブボーナス）</span>
          <div style="display:flex;flex-wrap:wrap;gap:6px">
            <sc-for list="{{ boostChips }}" as="b" hint-placeholder-count="7">
              <button type="button" onClick="{{ onSet }}" data-k="energy" data-v="{{ b.v }}" data-num="1" style="display:inline-flex;align-items:center;gap:5px;min-width:52px;padding:8px 13px;border:1px solid {{ b.bd }};border-radius:999px;background:{{ b.bg }};color:{{ b.fg }};font-size:12.5px;font-weight:800;font-family:'M PLUS Rounded 1c';cursor:pointer;box-shadow:var(--sh-xs);transition:transform .25s cubic-bezier(.34,1.45,.44,1)" style-active="transform:scale(.94)">{{ b.n }}<span style="font-size:10px;opacity:.7">{{ b.mult }}</span></button>
            </sc-for>
          </div>
        </div>
        <div>
          <span style="display:block;font-size:11.5px;font-weight:700;color:var(--text-2);margin-bottom:6px">分數來源</span>
          <div style="display:flex;flex-wrap:wrap;gap:6px">
            <sc-for list="{{ scoreModeChips }}" as="m" hint-placeholder-count="2">
              <button type="button" onClick="{{ onSet }}" data-k="scoreMode" data-v="{{ m.v }}" style="padding:8px 15px;border:1px solid {{ m.bd }};border-radius:999px;background:{{ m.bg }};color:{{ m.fg }};font-size:12.5px;font-weight:700;cursor:pointer;box-shadow:var(--sh-xs);transition:transform .25s cubic-bezier(.34,1.45,.44,1)" style-active="transform:scale(.94)">{{ m.n }}</button>
            </sc-for>
          </div>
          <div style="font-size:11px;color:var(--text-3);margin-top:7px;line-height:1.6">{{ scoreHint }}</div>
        </div>
      </div>
    </div>

    <div style="display:flex;gap:3px;padding:4px;border:1px solid var(--border);border-radius:999px;background:var(--card-2);overflow-x:auto;margin-bottom:14px">
      <sc-for list="{{ calcTabs }}" as="t" hint-placeholder-count="5">
        <button type="button" onClick="{{ onSet }}" data-k="ctab" data-v="{{ t.v }}" style="flex:none;padding:8px 16px;border:none;border-radius:999px;background:{{ t.bg }};color:{{ t.fg }};font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer;box-shadow:{{ t.sh }};transition:background .3s,color .2s">{{ t.n }}</button>
      </sc-for>
    </div>

    <div style="display:grid;grid-template-columns:{{ calcCols }};gap:14px;align-items:start">
      <div style="border:1px solid var(--border);border-radius:20px;padding:18px;background:var(--card);box-shadow:var(--sh-sm)">
        <div style="font-size:14px;font-weight:800;color:var(--ink);margin-bottom:13px">{{ calcInputTitle }}</div>
        <sc-for list="{{ calcFields }}" as="f" hint-placeholder-count="4">
          <label style="display:block;margin-bottom:11px"><span style="display:block;font-size:11.5px;font-weight:700;color:var(--text-2);margin-bottom:4px">{{ f.label }}</span>
            <input type="number" value="{{ f.value }}" onInput="{{ onField }}" data-k="{{ f.k }}" data-num="1" style="width:100%;padding:9px 13px;border:1.5px solid var(--border);border-radius:12px;background:var(--card);color:var(--text);font-size:14px;min-height:42px;outline:none;font-family:'M PLUS Rounded 1c';font-weight:700" style-focus="border-color:var(--accent)"></label>
        </sc-for>
        <sc-if value="{{ showModeChips }}">
          <span style="display:block;font-size:11.5px;font-weight:700;color:var(--text-2);margin:4px 0 6px">演出模式</span>
          <div style="display:flex;flex-wrap:wrap;gap:6px">
            <sc-for list="{{ modeChips }}" as="m" hint-placeholder-count="5">
              <button type="button" onClick="{{ onSet }}" data-k="mode" data-v="{{ m.v }}" style="padding:8px 14px;border:1px solid {{ m.bd }};border-radius:999px;background:{{ m.bg }};color:{{ m.fg }};font-size:12.5px;font-weight:700;cursor:pointer;box-shadow:var(--sh-xs);transition:transform .25s cubic-bezier(.34,1.45,.44,1)" style-active="transform:scale(.94)">{{ m.n }}</button>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{ showGcTarget }}">
          <span style="display:block;font-size:11.5px;font-weight:700;color:var(--text-2);margin:14px 0 6px">目標</span>
          <div style="display:flex;flex-direction:column;gap:6px">
            <sc-for list="{{ gcTargets }}" as="t" hint-placeholder-count="4">
              <button type="button" onClick="{{ onSet }}" data-k="gcT" data-v="{{ t.v }}" style="padding:9px 15px;border:1px solid {{ t.bd }};border-radius:13px;background:{{ t.bg }};color:{{ t.fg }};font-size:12.5px;font-weight:700;cursor:pointer;text-align:left">{{ t.n }}</button>
            </sc-for>
          </div>
        </sc-if>
      </div>

      <div style="display:flex;flex-direction:column;gap:12px">
        <div style="position:relative;overflow:hidden;border-radius:20px;padding:22px;background:var(--cta);color:#fff;box-shadow:0 10px 26px rgba(47,124,220,.25)">

          <div style="position:relative;font-size:11px;font-weight:800;letter-spacing:2.2px;opacity:.9">{{ resultLabel }}</div>

          <div style="position:relative;font-size:12.5px;opacity:.9;margin-top:4px">{{ resultSub }}</div>
        </div>

        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px">
          <sc-for list="{{ resultStats }}" as="s" hint-placeholder-count="3">
            <div style="border:1px solid var(--border);border-radius:16px;padding:13px 15px;background:var(--card);box-shadow:var(--sh-xs)">
              <div style="font-size:10.5px;font-weight:700;color:var(--text-3)">{{ s.l }}</div>
              <div style="font-size:19px;font-weight:800;color:var(--ink);font-family:'M PLUS Rounded 1c'">{{ s.v }}</div>
              <div style="font-size:10.5px;color:var(--text-3)">{{ s.sub }}</div>
            </div>
          </sc-for>
        </div>

        <sc-if value="{{ hasBoostTable }}">
          <div style="border:1px solid var(--border);border-radius:18px;background:var(--card);box-shadow:var(--sh-xs);overflow:hidden">
            <div style="padding:11px 16px;background:var(--card-2);font-size:11.5px;font-weight:800;color:var(--text-3);letter-spacing:.7px">各火數效率比較</div>
            <sc-for list="{{ boostTable }}" as="b" hint-placeholder-count="5">
              <div style="display:grid;grid-template-columns:60px 1fr 1fr;gap:10px;padding:9px 16px;border-top:1px solid var(--border);align-items:center;background:{{ b.rowBg }}">

                <span style="font-family:'M PLUS Rounded 1c';font-size:13px;font-weight:700;color:var(--ink)">{{ b.ep }} EP</span>

              </div>
            </sc-for>
          </div>

                  <span style="font-size:9.5px;font-weight:600;opacity:.75">{{ c.hint }}</span>

            <sc-for list="{{ effRows }}" as="r" hint-placeholder-count="8">
              <div style="display:grid;grid-template-columns:{{ effCols }};gap:10px;padding:10px 16px;border-top:1px solid var(--border);align-items:center;background:{{ r.rowBg }};transition:background .18s" style-hover="background:var(--bg-soft)">

                <span style="text-align:right;font-family:'M PLUS Rounded 1c';font-size:13px;font-weight:800;color:var(--ink)">{{ r.main }}</span>

              </sc-for>
            </div>
            <div style="font-size:12px;color:var(--text-2);margin-top:11px;line-height:1.8">{{ planSummary }}</div>

        <sc-if value="{{ showFormula }}">

            <sc-for list="{{ bdbAttrChips }}" as="c" hint-placeholder-count="6">
              <button type="button" onClick="{{ onBdbFilter }}" data-k="{{ c.k }}" data-v="{{ c.v }}" style="padding:4px 11px;border:none;border-radius:999px;background:{{ c.bg }};color:{{ c.fg }};font-size:11px;font-weight:700;cursor:pointer;box-shadow:{{ c.sh }}">{{ c.n }}</button>
            </sc-for>
          </div>
        </sc-if>

        <div style="display:flex;flex-wrap:wrap;gap:5px;padding-top:9px;border-top:1px solid var(--border)">
          <sc-for list="{{ bdbSortChips }}" as="c" hint-placeholder-count="2">
            <button type="button" onClick="{{ onBdbSort }}" data-v="{{ c.v }}" style="padding:6px 14px;border:none;border-radius:999px;background:{{ c.bg }};color:{{ c.fg }};font-size:12px;font-weight:700;cursor:pointer;box-shadow:{{ c.sh }}">{{ c.n }}</button>
          </sc-for>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px">
        <sc-for list="{{ bdbStats }}" as="st" hint-placeholder-count="4">
          <div style="border:1px solid var(--border);border-radius:13px;background:var(--card-2);padding:9px 11px">
            <div style="font-size:10px;color:var(--text-3);font-weight:700">{{ st.l }}</div>
            <div style="font-family:'M PLUS Rounded 1c';font-size:15px;font-weight:800;color:var(--ink);margin-top:2px">{{ st.v }}</div>
          </div>
        </sc-for>
      </div>

      <div style="font-size:11.5px;color:var(--text-3);margin-bottom:8px;font-family:'M PLUS Rounded 1c'">{{ bdbCount }}</div>

      <div style="border:1px solid var(--border);border-radius:18px;background:var(--card);box-shadow:var(--sh-xs);overflow-x:auto">
        <div style="min-width:{{ bdbMinW }}">
          <div style="display:grid;grid-template-columns:{{ bdbCols }};gap:8px;padding:11px 15px;border-bottom:1px solid var(--border);font-size:11px;font-weight:800;color:var(--text-3)">
            <span>期數</span><span>活動</span>
            <sc-if value="{{ bdbWide }}"><sc-if value="{{ bdbNotWL }}"><span>角色</span></sc-if><span>團體</span></sc-if>
            <sc-if value="{{ bdbWide }}"><span style="text-align:center">長度</span></sc-if>
            <span style="text-align:right">榜線</span>
          </div>
          <sc-for list="{{ bdbRows }}" as="r" hint-placeholder-count="20">
            <div style="display:grid;grid-template-columns:{{ bdbCols }};gap:8px;padding:10px 15px;border-bottom:1px solid var(--border);font-size:12.5px;align-items:center;background:{{ r.bg }}">
              <span style="font-family:'M PLUS Rounded 1c';font-weight:800;color:var(--accent-deep)"><sc-if value="{{ r.hasNo }}"><span style="display:inline-block;min-width:22px;color:var(--text-3);font-size:11px">{{ r.no }}.</span></sc-if>{{ r.rk }}</span>
              <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);font-weight:700">{{ r.name }}</span>
              <sc-if value="{{ bdbWide }}">
                <sc-if value="{{ bdbNotWL }}"><span style="color:var(--text-2)">{{ r.chara }}</span></sc-if>
                <span style="color:var(--text-2)">{{ r.unit }}</span>
              </sc-if>
              <sc-if value="{{ bdbWide }}"><span style="text-align:center;color:var(--text-3);font-family:'M PLUS Rounded 1c'">{{ r.days }}</span></sc-if>
              <span style="text-align:right;font-family:'M PLUS Rounded 1c';font-weight:800;color:var(--ink)">{{ r.score }}</span>
            </div>
          </sc-for>
        </div>
      </div>

      <sc-if value="{{ bdbMoreBtn }}">
        <button type="button" onClick="{{ onBdbMore }}" style="width:100%;margin-top:10px;padding:11px;border:1px solid var(--border);border-radius:14px;background:var(--card);color:var(--accent-deep);font-size:12.5px;font-weight:700;cursor:pointer;box-shadow:var(--sh-xs)">再顯示 {{ bdbMoreN }} 筆 ▾</button>
      </sc-if>

      <!-- WL 交換所規劃：徽章有限，先看總需求再決定換什麼 -->
      <sc-if value="{{ exOn }}">
        <div style="border:1px solid var(--border);border-radius:20px;background:var(--card);box-shadow:var(--sh-xs);padding:17px 19px;margin-top:16px">
          <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px">
            <span style="font-size:14px;font-weight:800;color:var(--ink)">WL 交換所規劃</span>
            <span style="font-size:11.5px;color:var(--accent-deep);font-weight:700;font-family:'M PLUS Rounded 1c'">{{ exTotal }}</span>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:11px">
            <sc-for list="{{ exTurnChips }}" as="c" hint-placeholder-count="2">
              <button type="button" onClick="{{ onExTurn }}" data-v="{{ c.v }}" style="padding:5px 13px;border:none;border-radius:999px;background:{{ c.bg }};color:{{ c.fg }};font-size:11.5px;font-weight:700;cursor:pointer;box-shadow:{{ c.sh }}">{{ c.n }}</button>
            </sc-for>
            <span style="width:1px;background:var(--border);margin:0 3px"></span>
            <sc-for list="{{ exChChips }}" as="c" hint-placeholder-count="2">
              <button type="button" onClick="{{ onExCh }}" data-v="{{ c.v }}" style="padding:5px 13px;border:none;border-radius:999px;background:{{ c.bg }};color:{{ c.fg }};font-size:11.5px;font-weight:700;cursor:pointer;box-shadow:{{ c.sh }}">{{ c.n }}</button>
            </sc-for>
          </div>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,268px),1fr));gap:10px">
            <sc-for list="{{ exSecs }}" as="sec" hint-placeholder-count="7">
              <div style="border:1px solid var(--border);border-radius:14px;background:var(--card-2);padding:12px 14px;opacity:{{ sec.op }}">
                <div style="font-size:12.5px;font-weight:800;color:var(--accent-deep)">{{ sec.title }}</div>
                <div style="font-size:10.5px;color:var(--text-3);margin-bottom:8px;font-family:'M PLUS Rounded 1c'">{{ sec.sub }}</div>
                <sc-for list="{{ sec.items }}" as="it" hint-placeholder-count="5">
                  <div style="display:grid;grid-template-columns:minmax(0,1fr) 62px 46px;gap:6px;padding:5px 0;border-top:1px solid var(--border);font-size:11.5px;align-items:center">
                    <span style="color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ it.n }}</span>
                    <span style="text-align:right;font-family:'M PLUS Rounded 1c';color:var(--ink)">{{ it.cost }}</span>
                    <span style="text-align:right;font-family:'M PLUS Rounded 1c';color:var(--text-3)">{{ it.max }}</span>
                  </div>
                </sc-for>
              </div>
            </sc-for>
          </div>
          <div style="font-size:11px;color:var(--text-3);margin-top:10px;line-height:1.7">欄位為「道具・徽章需求・可換上限」。表上固定列 6 個章節交換所，但實際章節數各場不同 —— WL2 是 OC 團 4 章、V 家 6 章；WL3 是 5 章、其中 3.2 為 6 章；終章只有一個交換所、不需要規劃。用上方切換，超出的章節會標灰且不計入總需求。規劃表製作：good果汁（原作 Narwhal／國際服）　<a href="https://docs.google.com/spreadsheets/d/1V00MxDxbL0QyMD-5hha92Q2w9ZfTHzPMW-aeKI493Bk/edit?usp=drive_link" target="_blank" rel="noopener" style="color:var(--accent-deep);font-weight:700">原始表格 ↗</a></div>
        </div>
      </sc-if>

      <div style="font-size:11px;color:var(--text-3);margin-top:11px;line-height:1.7">{{ bdbSrcNote }}原始表格：<a href="https://docs.google.com/spreadsheets/d/1GrB74wgDgJyRe_lNKpwWHjXrnCYOZP9M8L9uuQHJafA/edit?usp=sharing" target="_blank" rel="noopener" style="color:var(--accent-deep);font-weight:700">台服全榜線紀錄 ↗</a>　<a href="https://docs.google.com/spreadsheets/d/15P85CdYfmFh58iJxgOkS4ZvyrJ7SGPf6IIRA2AEh-ts/edit?usp=sharing" target="_blank" rel="noopener" style="color:var(--accent-deep);font-weight:700">台服 WL 榜線紀錄 ↗</a></div>
    </sc-if>
  </div>
  </sc-if>

  <!-- ========== 我的帳號 ========== -->
  <sc-if value="{{ isAccount }}">
  <div style="animation:pageIn var(--anim) cubic-bezier(.32,.72,.24,1)">

    <!-- 未登入 -->
    <sc-if value="{{ acLoggedOut }}">
      <div style="border:1px solid var(--border);border-radius:20px;padding:26px 22px;background:var(--card);box-shadow:var(--sh-sm);text-align:center">
        <div style="font-size:17px;font-weight:800;color:var(--ink);margin-bottom:8px">登入以同步你的資料</div>
        <div style="font-size:13px;color:var(--text-2);line-height:1.8;margin-bottom:18px;max-width:520px;margin-left:auto;margin-right:auto">
          目前你的遊戲 uid、持卡勾選、編組設定都只存在這台裝置的瀏覽器裡，換手機或清快取就沒了。
          登入之後會存到雲端，跨裝置共用。<br>
          登入也才能使用偵測訂閱 —— 榜線到達你設定的門檻、或追蹤的玩家有動靜時，寄信通知你。
        </div>
        <a href="{{ acLoginUrl }}" style="display:inline-block;padding:12px 26px;border-radius:999px;background:var(--ink-grad);color:#fff;font-size:14px;font-weight:800;text-decoration:none;box-shadow:var(--sh-sm)">使用 Google 帳號登入</a>
        <div style="font-size:11px;color:var(--text-3);margin-top:14px;line-height:1.7">
          本站只會取得你的 Google 名稱、頭像與信箱（信箱用來寄通知）。不會讀取你的信件或其他資料。<br>
          新帳號需要管理員核准後才能使用訂閱功能。
        </div>
        <sc-if value="{{ acErr }}">
          <div style="margin-top:14px;padding:11px 14px;border-radius:12px;background:color-mix(in oklab,#e0576a 10%,transparent);color:var(--text-2);font-size:11.5px;line-height:1.75;text-align:left">
            <b>連線後端時發生問題</b>（這代表登入狀態讀不到，不一定是你沒登入）：<br>
            <code style="font-size:11px;word-break:break-all">{{ acErr }}</code><br>
            <span style="color:var(--text-3)">把這行字回報給站方即可。</span>
          </div>
        </sc-if>
      </div>
    </sc-if>

    <!-- 等待審核 -->
    <sc-if value="{{ acPending }}">
      <div style="border:1px solid var(--border);border-radius:20px;padding:22px;background:var(--card);box-shadow:var(--sh-sm);margin-bottom:13px">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
          <img src="{{ acPic }}" referrerpolicy="no-referrer" style="width:44px;height:44px;border-radius:50%;border:1px solid var(--border)" onerror="this.style.visibility='hidden'">
          <div><div style="font-size:15px;font-weight:800;color:var(--ink)">{{ acName }}</div>
            <div style="font-size:11.5px;color:var(--text-3)">{{ acEmail }}</div></div>
        </div>
        <div style="padding:12px 15px;border-radius:13px;background:color-mix(in oklab,#ffb86b 14%,transparent);color:var(--text-2);font-size:12.5px;line-height:1.75;margin-bottom:12px">
          你的帳號正在等待管理員核准。核准之前可以先登入，但還不能建立偵測訂閱。<br>
          填好下面三項送出，系統會自動初審並通知管理員，通常比純人工快很多。
        </div>
        <div style="margin-bottom:10px">
          <div style="font-size:11.5px;font-weight:700;color:var(--text-2);margin-bottom:4px">玩家 id</div>
          <input type="text" inputmode="numeric" value="{{ applyUid }}" onInput="{{ onField }}" data-k="applyUid" placeholder="15～20 位數字" style="width:100%;padding:9px 13px;border:1.5px solid var(--border);border-radius:12px;background:var(--card-2);color:var(--text);font-size:13px;min-height:42px;outline:none;font-family:inherit">
          <div style="font-size:11px;color:var(--text-3);margin-top:4px;line-height:1.7">遊戲左上角頭像 → 個人檔案可以看到。</div>
        </div>
        <div style="margin-bottom:10px">
          <div style="font-size:11.5px;font-weight:700;color:var(--text-2);margin-bottom:4px">玩家等級</div>
          <input type="number" value="{{ applyLv }}" onInput="{{ onField }}" data-k="applyLv" data-num="1" placeholder="例如 180" style="width:100%;padding:9px 13px;border:1.5px solid var(--border);border-radius:12px;background:var(--card-2);color:var(--text);font-size:13px;min-height:42px;outline:none;font-family:inherit">
        </div>
        <div style="margin-bottom:10px">
          <div style="font-size:11.5px;font-weight:700;color:var(--text-2);margin-bottom:4px">想說的一句話（選填）</div>
          <textarea maxlength="100" placeholder="例如：想用來算隊伍倍率" value="{{ applyNote }}" onInput="{{ onField }}" data-k="applyNote" style="width:100%;min-height:62px;padding:11px 14px;border:1.5px solid var(--border);border-radius:12px;background:var(--card-2);color:var(--text);font-size:13px;outline:none;resize:vertical;font-family:inherit"></textarea>
          <div style="font-size:11px;color:var(--text-3);margin-top:4px;line-height:1.7">這句話會送交 AI 服務（Anthropic，美國）做自動初審，請不要填真實姓名、電話或其他個人資料。留空是完全正當的選擇，不會因此影響審核。（{{ applyNoteCount }}）</div>
        </div>
        <div style="display:flex;gap:9px;margin-top:10px;flex-wrap:wrap">
          <button type="button" onClick="{{ onApply }}" style="padding:10px 20px;border:none;border-radius:999px;background:var(--ink-grad);color:#fff;font-size:13px;font-weight:800;cursor:pointer">{{ acApplyBtn }}</button>
          <a href="{{ acLogoutUrl }}" style="padding:10px 20px;border:1px solid var(--border);border-radius:999px;background:var(--card-2);color:var(--text-2);font-size:13px;font-weight:700;text-decoration:none">登出</a>
        </div>
        <div style="font-size:11.5px;color:var(--accent-deep);margin-top:9px">{{ acMsg }}</div>

        <sc-if value="{{ acCheckShow }}">
          <div style="margin-top:11px;padding:11px 14px;border-radius:12px;background:var(--card-2);border:1px solid var(--border)">
            <div style="font-size:11.5px;font-weight:800;color:var(--ink);margin-bottom:4px">系統檢查</div>
            <div style="font-size:12px;color:var(--text-2);line-height:1.75">{{ acCheckText }}</div>
          </div>
        </sc-if>

        <sc-if value="{{ acVerifyShow }}">
          <div style="margin-top:11px;padding:12px 15px;border-radius:13px;background:color-mix(in oklab,var(--accent) 9%,transparent);border:1px solid var(--border)">
            <div style="font-size:12px;font-weight:800;color:var(--ink);margin-bottom:5px">證明這個帳號是你的（選填，但會大幅加快審核）</div>
            <div style="font-size:11.5px;color:var(--text-2);line-height:1.8;margin-bottom:8px">
              填寫 id 只能證明那個帳號存在 —— 站上的排行榜就公開列著別人的 id，任何人都抄得到。<br>
              要證明它是你的，只要把驗證碼貼進遊戲內的自我介紹，我們讀得到就算數。
            </div>
            <sc-if value="{{ acVerified }}">
              <div style="font-size:12px;font-weight:800;color:var(--accent-deep)">已完成驗證，這個遊戲帳號已確認屬於你。</div>
            </sc-if>
            <sc-if value="{{ acNotVerified }}">
              <sc-if value="{{ acNonceShow }}">
                <div style="padding:10px 14px;border-radius:11px;background:var(--card);border:1px dashed var(--border);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:19px;font-weight:800;letter-spacing:2px;color:var(--ink);text-align:center;margin-bottom:7px">{{ acNonce }}</div>
                <div style="font-size:11.5px;color:var(--text-2);line-height:1.8;margin-bottom:8px">
                  貼進遊戲內「個人檔案 → 自我介紹」並存檔，再回來按下面的按鈕。<br>
                  原本的自我介紹可以保留，驗證碼放在任何位置都可以；驗證完就能改回去。
                </div>
              </sc-if>
              <div style="display:flex;gap:8px;flex-wrap:wrap">
                <sc-if value="{{ acNonceShow }}">
                  <button type="button" onClick="{{ onVerifyCheck }}" style="padding:8px 17px;border:none;border-radius:999px;background:var(--ink-grad);color:#fff;font-size:12.5px;font-weight:800;cursor:pointer">{{ acCheckBtn }}</button>
                </sc-if>
                <button type="button" onClick="{{ onVerifyStart }}" style="padding:8px 17px;border:1px solid var(--border);border-radius:999px;background:var(--card-2);color:var(--text-2);font-size:12.5px;font-weight:700;cursor:pointer">{{ acNonceBtn }}</button>
              </div>
            </sc-if>
            <div style="font-size:11.5px;color:var(--accent-deep);margin-top:8px">{{ acVerifyMsg }}</div>
          </div>
        </sc-if>
      </div>
    </sc-if>

    <!-- 已核准 -->
    <sc-if value="{{ acReady }}">
      <div style="border:1px solid var(--border);border-radius:20px;padding:20px 22px;background:var(--card);box-shadow:var(--sh-sm);margin-bottom:13px">
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
          <img src="{{ acPic }}" referrerpolicy="no-referrer" style="width:48px;height:48px;border-radius:50%;border:1px solid var(--border)" onerror="this.style.visibility='hidden'">
          <div style="flex:1;min-width:150px">
            <div style="font-size:15.5px;font-weight:800;color:var(--ink)">{{ acName }}<span style="font-size:11px;font-weight:700;color:var(--accent-deep);margin-left:8px">{{ acRole }}</span></div>
            <div style="font-size:11.5px;color:var(--text-3)">{{ acEmail }}</div>
          </div>
          <a href="{{ acLogoutUrl }}" style="padding:8px 17px;border:1px solid var(--border);border-radius:999px;background:var(--card-2);color:var(--text-2);font-size:12px;font-weight:700;text-decoration:none">登出</a>
        </div>
      </div>

      <!-- AI 用量 -->
      <sc-if value="{{ usShow }}">
        <div style="border:1px solid var(--border);border-radius:20px;padding:20px 22px;background:var(--card);box-shadow:var(--sh-sm);margin-bottom:13px">
          <div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:9px">
            <div style="font-size:14.5px;font-weight:800;color:var(--ink)">AI 用量</div>
            <span style="padding:2px 9px;border-radius:999px;font-size:10.5px;font-weight:800;color:#fff;background:{{ usStatusColor }}">{{ usStatusText }}</span>
            <div style="flex:1"></div>
            <div style="font-size:12.5px;color:var(--text-2)">今日 <b style="font-size:16px;color:var(--ink)">{{ usUsedText }}</b></div>
          </div>
          <sc-if value="{{ usLimited }}">
            <div style="height:8px;border-radius:999px;background:var(--card-2);border:1px solid var(--border);overflow:hidden;margin-bottom:11px"><div style="height:100%;width:{{ usPct }};background:{{ usBarColor }};border-radius:999px"></div></div>
          </sc-if>
          <sc-if value="{{ usProbation }}">
            <div style="font-size:11.5px;color:#e0a000;margin-bottom:9px">帳號還在試用額度（自動核准後尚未人工覆核），管理員確認後回到一般額度。</div>
          </sc-if>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px;margin-bottom:10px">
            <div style="border:1px solid var(--border);border-radius:13px;padding:10px 12px;background:var(--card-2)">
              <div style="font-size:11px;color:var(--text-3);font-weight:700">今日</div>
              <div style="font-size:18px;font-weight:800;color:var(--ink);font-family:'M PLUS Rounded 1c'">{{ usToday.cost }}</div>
              <div style="font-size:11px;color:var(--text-2)">{{ usToday.calls }} 次・{{ usToday.tok }} tokens</div>
            </div>
            <div style="border:1px solid var(--border);border-radius:13px;padding:10px 12px;background:var(--card-2)">
              <div style="font-size:11px;color:var(--text-3);font-weight:700">近 30 天</div>
              <div style="font-size:18px;font-weight:800;color:var(--ink);font-family:'M PLUS Rounded 1c'">{{ usMonth.cost }}</div>
              <div style="font-size:11px;color:var(--text-2)">{{ usMonth.calls }} 次・{{ usMonth.tok }} tokens</div>
            </div>
            <div style="border:1px solid var(--border);border-radius:13px;padding:10px 12px;background:var(--card-2)">
              <div style="font-size:11px;color:var(--text-3);font-weight:700">累計</div>
              <div style="font-size:18px;font-weight:800;color:var(--ink);font-family:'M PLUS Rounded 1c'">{{ usAll.cost }}</div>
              <div style="font-size:11px;color:var(--text-2)">{{ usAll.calls }} 次・{{ usAll.tok }} tokens</div>
            </div>

  <!-- ========== 站內助手 ========== -->
  <sc-if value="{{ isAssistant }}">

        <a href="?page=account" style="color:var(--accent-deep);font-weight:700">前往我的帳號送出申請</a>
      </div>

        <div style="font-size:11.5px;color:var(--text-3);line-height:1.7;margin-bottom:12px">
          可以查當期與歷史榜線、活動與卡池排程、你的遊戲資料與持卡、教學大全，並依此做多步驟規劃。
          它讀得到的就是站上這些資料，回答前會實際去查。每人每天 20 次操作，一次提問算一次。<sc-if value="{{ aiQuotaShow }}"><span style="display:inline-block;margin-left:6px;padding:1px 9px;border-radius:999px;background:color-mix(in oklab,var(--accent) 16%,transparent);color:var(--accent-deep);font-weight:800">{{ aiQuotaText }}</span></sc-if>

          <sc-if value="{{ aiEmpty }}">

              </sc-for>
            </div>

          <sc-for list="{{ aiBubbles }}" as="m" hint-placeholder-count="4">

              <div style="max-width:88%;padding:10px 14px;border-radius:15px;background:{{ m.bg }};color:{{ m.fg }};font-size:13px;line-height:1.8;white-space:{{ m.wrap }};border:1px solid {{ m.bd }};overflow-wrap:break-word">{{ m.text }}{{ m.html }}</div>

          <sc-if value="{{ admBusy }}">

          </sc-if>

  <sc-if value="{{ isCredits }}">

    <div style="border:1px solid var(--border);border-radius:20px;background:var(--card);box-shadow:var(--sh-xs);padding:18px 20px">
      <div style="font-size:15px;font-weight:800;color:var(--ink);margin-bottom:5px">由衷感謝對本遊戲有熱忱的資料整理者們</div>
      <div style="font-size:12.5px;color:var(--text-2);line-height:1.85">本站內容有許多重要資源整理有借鑑他人心血：教學問答由<strong style="color:var(--ink)">世界計畫開瓶器編輯群</strong>無償撰寫。若沒有大佬們的熱心鼎力相助、各位友列的測試及協助，也沒有這樣完善、使用體驗佳的網站。<span style="color:var(--text-3)">（持續更新中）</span></div>
    </div>

    <!-- 問答編輯群 -->
    <div style="border:1px solid var(--border);border-radius:20px;background:var(--card);box-shadow:var(--sh-xs);padding:18px 20px">
      <div style="font-size:14px;font-weight:800;color:var(--ink);margin-bottom:3px">世界計畫開瓶器編輯群</div>
      <div style="font-size:11.5px;color:var(--text-3);margin-bottom:12px;line-height:1.6">教學大全 115 則問答的撰寫者。順序僅為加入順序，無先後之分。</div>
      <div style="display:flex;flex-wrap:wrap;gap:7px">
        <sc-for list="{{ creditEditors }}" as="e" hint-placeholder-count="14">
          <span style="padding:6px 14px;border:1px solid var(--border);border-radius:999px;background:var(--card-2);font-size:13px;font-weight:700;color:var(--ink)">{{ e }}</span>
        </sc-for>
      </div>
    </div>

    <!-- 資料表作者：附原始連結 -->
    <sc-for list="{{ creditWorks }}" as="w" hint-placeholder-count="2">
      <div style="border:1px solid var(--border);border-radius:20px;background:var(--card);box-shadow:var(--sh-xs);padding:18px 20px">
        <div style="display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:11px">
          <span style="font-size:14px;font-weight:800;color:var(--ink)">{{ w.who }}</span>
          <span style="font-size:11.5px;color:var(--text-3)">{{ w.sub }}</span>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:9px">
          <sc-for list="{{ w.items }}" as="it" hint-placeholder-count="4">
            <a href="{{ it.u }}" target="{{ it.target }}" rel="noopener" style="display:block;padding:12px 14px;border:1px solid var(--border);border-radius:14px;background:var(--card-2);text-decoration:none;transition:transform .2s,border-color .2s" style-hover="transform:translateY(-2px);border-color:var(--accent)">
              <div style="font-size:13.5px;font-weight:800;color:var(--ink)">{{ it.n }}{{ it.arrow }}</div>
              <div style="font-size:11.5px;color:var(--text-3);margin-top:3px;line-height:1.6">{{ it.d }}</div>
            </a>
          </sc-for>
        </div>
      </div>
    </sc-for>

    <!-- 建議並實際採納 -->
    <div style="border:1px solid var(--border);border-radius:20px;background:var(--card);box-shadow:var(--sh-xs);padding:18px 20px">
      <div style="font-size:14px;font-weight:800;color:var(--ink);margin-bottom:3px">提供建議並實際採納</div>
      <div style="font-size:11.5px;color:var(--text-3);margin-bottom:12px;line-height:1.6">站上有一大部分功能與修正，採納自各位友列的建議。</div>
      <div style="display:flex;flex-wrap:wrap;gap:7px">
        <sc-for list="{{ creditAdvisors }}" as="a" hint-placeholder-count="6">
          <span style="padding:6px 14px;border:1px solid var(--border);border-radius:999px;background:var(--card-2);font-size:13px;font-weight:700;color:var(--ink)">{{ a }}</span>
        </sc-for>
      </div>
    </div>

    <!-- 聯絡：資料有誤、想加功能、或想回報 bug 都走這裡 -->
    <div style="border:1px solid var(--border);border-radius:20px;background:var(--card);box-shadow:var(--sh-xs);padding:18px 20px">
      <div style="font-size:14px;font-weight:800;color:var(--ink);margin-bottom:3px">聯絡 Omega</div>
      <div style="font-size:11.5px;color:var(--text-3);margin-bottom:12px;line-height:1.6">資料有誤、想加功能、或發現問題，都歡迎直接私訊建議。</div>
      <div style="display:inline-flex;align-items:center;gap:10px;padding:10px 15px;border:1px solid var(--border);border-radius:14px;background:var(--card-2)">
        <svg viewBox="0 0 127 96" style="width:22px;height:auto;flex:none" aria-label="Discord"><path fill="#5865F2" d="M107.7 8.07A105.15 105.15 0 0 0 81.47 0a72.06 72.06 0 0 0-3.36 6.83 97.68 97.68 0 0 0-29.11 0A72.37 72.37 0 0 0 45.64 0a105.89 105.89 0 0 0-26.25 8.09C2.79 32.65-1.71 56.6.54 80.21a105.73 105.73 0 0 0 32.17 16.15 77.7 77.7 0 0 0 6.89-11.11 68.42 68.42 0 0 1-10.85-5.18c.91-.66 1.8-1.34 2.66-2a75.57 75.57 0 0 0 64.32 0c.87.71 1.76 1.39 2.66 2a68.68 68.68 0 0 1-10.87 5.19 77 77 0 0 0 6.89 11.1 105.25 105.25 0 0 0 32.19-16.14c2.64-27.38-4.51-51.11-18.9-72.15ZM42.45 65.69C36.18 65.69 31 60 31 53s5-12.74 11.43-12.74S54 46 53.89 53s-5.05 12.69-11.44 12.69Zm42.24 0C78.41 65.69 73.25 60 73.25 53s5-12.74 11.44-12.74S96.23 46 96.12 53s-5.04 12.69-11.43 12.69Z"/></svg>
        <span style="font-family:'M PLUS Rounded 1c';font-size:14.5px;font-weight:800;color:var(--ink);user-select:all">euler_formula_best</span>
      </div>
    </div>

    <!-- 著作權 -->
    <div style="border:1px solid var(--border-2);border-radius:20px;background:var(--card-2);padding:16px 19px">
      <div style="font-size:13px;font-weight:800;color:var(--ink);margin-bottom:5px">著作權聲明</div>
      <div style="font-size:12px;color:var(--text-2);line-height:1.85">歡迎轉載，但請註明作者出處。本站整合的各份資料表、教學問答，著作權均屬原作者所有；上方每一項都附了原始連結，引用時請一併標註來源。</div>
    </div>
  </div>
  </sc-if>

  <!-- ========== 抽卡模擬 ========== -->
  <sc-if value="{{ isGachaSim }}">
  <div style="animation:pageIn var(--anim) cubic-bezier(.32,.72,.24,1)">
    <div style="border:1px solid var(--border);border-radius:20px;background:var(--card);box-shadow:var(--sh-sm);overflow:hidden">
      <iframe id="gachaSimFrame" data-src="./index.html?embed=gachasim" title="抽卡模擬" scrolling="no" style="width:100%;height:760px;border:none;background:transparent;display:block"></iframe>
    </div>
    <div style="font-size:11.5px;color:var(--text-3);margin-top:10px;line-height:1.7">機率、卡池內容與保底規則全部取自官方 master 資料（gachaCardRarityRates／gachaDetails／gachaBehaviors），不是估算值。模擬結果僅供參考，不代表實際抽卡。</div>

    <div style="display:flex;align-items:center;gap:9px;margin:22px 0 11px"><span style="width:8px;height:20px;border-radius:5px;background:var(--rainbow);background-size:400% 100%"></span><span style="font-size:15px;font-weight:800;color:var(--ink)">抽卡期望 · 天井 · 招募點數保底</span></div>
    <div style="border:1px solid var(--border);border-radius:20px;background:var(--card);box-shadow:var(--sh-sm);overflow:hidden">
      <iframe id="gachaCalcFrame" data-src="./index.html?embed=gachacalc" title="抽卡期望與保底計算" scrolling="no" style="width:100%;height:1180px;border:none;background:transparent;display:block"></iframe>
    </div>
    <div style="font-size:11.5px;color:var(--text-3);margin-top:10px;line-height:1.7">招募點數與 300 抽天井是兩套獨立的保底：天井靠貼紙換卡，招募點數則是抽卡累積點數到門檻直接發卡。付費水晶一抽 1 點、免費水晶與招募券一抽 0.5 點。</div>
  </div>
  </sc-if>

  <!-- ========== 收集室（貼圖／稱號圖鑑） ========== -->
  <sc-if value="{{ isCollect }}">
  <div style="animation:pageIn var(--anim) cubic-bezier(.32,.72,.24,1)">
    <div style="display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:12px">
      <div style="display:inline-flex;gap:3px;padding:4px;border:1px solid var(--border);border-radius:999px;background:var(--card-2)">
        <sc-for list="{{ colTabs }}" as="t" hint-placeholder-count="2">
          <button type="button" onClick="{{ onColTab }}" data-v="{{ t.v }}" style="padding:8px 20px;border:none;border-radius:999px;background:{{ t.bg }};color:{{ t.fg }};font-size:13px;font-weight:700;cursor:pointer;box-shadow:{{ t.sh }};transition:background .3s,color .2s">{{ t.n }}</button>
        </sc-for>
      </div>
      <input type="text" placeholder="搜尋名稱、系列、取得條件…" value="{{ cq }}" onInput="{{ onField }}" data-k="cq" style="flex:1;min-width:190px;padding:11px 17px;border:1.5px solid var(--border);border-radius:999px;background:var(--card);color:var(--text);font-size:14px;min-height:44px;outline:none;box-shadow:var(--sh-xs)" style-focus="border-color:var(--accent)">
    </div>
    <div style="font-size:12px;color:var(--text-3);margin-bottom:10px;font-family:'M PLUS Rounded 1c'">{{ colCount }}</div>

    <sc-if value="{{ colHasErr }}">
      <button type="button" onClick="{{ onColReload }}" style="width:100%;padding:12px;border:1px solid var(--border);border-radius:14px;background:var(--card-2);color:var(--accent);font-size:13px;font-weight:700;cursor:pointer;margin-bottom:12px">{{ colErrMsg }}</button>
    </sc-if>
    <sc-if value="{{ colBusy }}">
      <div style="padding:44px;text-align:center;color:var(--text-3);font-size:13px">
        <span style="display:inline-block;width:18px;height:18px;border-radius:50%;border:2.5px solid var(--border-2);border-top-color:var(--accent);animation:spin .8s linear infinite;vertical-align:-4px;margin-right:8px"></span>載入收集室資料…
      </div>
    </sc-if>

    <sc-if value="{{ colIsStamp }}">
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:12px">
        <sc-for list="{{ colRows }}" as="c" hint-placeholder-count="12">
          <div onClick="{{ onColPick }}" data-id="{{ c.id }}" title="{{ c.name }}" style="border:1px solid var(--border);border-left:3px solid {{ c.accent }};border-radius:15px;background:var(--card);box-shadow:var(--sh-xs);cursor:pointer;overflow:hidden;transition:transform .2s,box-shadow .2s" style-hover="transform:translateY(-3px);box-shadow:var(--sh-sm)">
            <div style="aspect-ratio:1;background:var(--card-2);display:grid;place-items:center;padding:7px">
              <img src="{{ c.img }}" referrerpolicy="no-referrer" decoding="async" alt="" width="296" height="256" style="width:100%;height:100%;object-fit:contain;display:block">
            </div>
            <div style="padding:7px 9px 9px;font-size:11px;font-weight:700;color:var(--ink);line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:2.7em">{{ c.name }}</div>
          </div>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{ colIsHonor }}">
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:12px">
        <sc-for list="{{ colRows }}" as="c" hint-placeholder-count="8">
          <div onClick="{{ onColPick }}" data-id="{{ c.id }}" title="{{ c.name }}" style="border:1px solid var(--border);border-radius:15px;background:var(--card);box-shadow:var(--sh-xs);cursor:pointer;padding:11px 12px;transition:transform .2s,box-shadow .2s" style-hover="transform:translateY(-3px);box-shadow:var(--sh-sm)">
            <img src="{{ c.img }}" referrerpolicy="no-referrer" decoding="async" alt="" width="380" height="80" style="width:100%;aspect-ratio:380/80;object-fit:contain;display:block;border-radius:6px">
            <div style="font-size:12px;font-weight:800;color:var(--ink);margin-top:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ c.name }}</div>
            <div style="font-size:10.5px;color:var(--text-3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ c.sub }}</div>
          </div>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{ colEmpty }}">
      <div style="padding:38px 18px;text-align:center;color:var(--text-3);font-size:13px;border:1px solid var(--border);border-radius:18px;background:var(--card)">沒有符合的項目，試著清空搜尋。</div>
    </sc-if>

    <div style="display:flex;align-items:center;justify-content:center;gap:14px;margin-top:16px">
      <button type="button" onClick="{{ onPage }}" data-k="cp" data-d="-1" style="padding:9px 20px;border:1px solid var(--border);border-radius:999px;background:var(--card);color:var(--text);font-size:13px;font-weight:700;cursor:pointer;box-shadow:var(--sh-xs)">← 上頁</button>
      <span style="font-size:13px;color:var(--text-3);font-family:'M PLUS Rounded 1c';font-weight:700">{{ colPageLabel }}</span>
      <button type="button" onClick="{{ onPage }}" data-k="cp" data-d="1" style="padding:9px 20px;border:1px solid var(--border);border-radius:999px;background:var(--card);color:var(--text);font-size:13px;font-weight:700;cursor:pointer;box-shadow:var(--sh-xs)">下頁 →</button>
    </div>
  </div>
  </sc-if>

  <!-- ========== 分析中心 ========== -->
  <sc-if value="{{ isAnalysis }}">
  <div style="animation:pageIn var(--anim) cubic-bezier(.32,.72,.24,1)">
    <div style="display:{{ anaTabDisp }};grid-template-columns:{{ anaTabCols }};gap:3px;padding:4px;border:1px solid var(--border);border-radius:{{ anaTabRad }};background:var(--card-2);margin-bottom:13px">
      <sc-for list="{{ anaTabs }}" as="t" hint-placeholder-count="4">
        <button type="button" onClick="{{ onAnaTab }}" data-v="{{ t.v }}" style="padding:9px 10px;border:none;border-radius:{{ anaTabBtnRad }};background:{{ t.bg }};color:{{ t.fg }};font-size:13px;font-weight:700;cursor:pointer;box-shadow:{{ t.sh }};transition:background .3s,color .2s;white-space:nowrap">{{ t.n }}</button>
      </sc-for>
    </div>

    <!-- 榜線分析 -->
    <sc-if value="{{ anaIsBorder }}">
      <div style="font-size:12px;color:var(--text-3);margin-bottom:9px;font-family:'M PLUS Rounded 1c'">{{ anaMeta }}</div>
      <div style="padding:10px 14px;border-radius:13px;background:var(--card-2);color:var(--text-2);font-size:11.5px;line-height:1.6;margin-bottom:8px">{{ anaMethod }}</div>
      <div style="padding:9px 14px;border-radius:13px;background:color-mix(in oklab,#e0576a 8%,transparent);color:var(--text-2);font-size:11px;line-height:1.6;margin-bottom:12px">{{ anaBias }}</div>
      <div style="border:1px solid var(--border);border-radius:20px;background:var(--card);box-shadow:var(--sh-xs);padding:16px 18px;margin-bottom:13px">
        <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px">
          <span style="font-size:13.5px;font-weight:800;color:var(--ink)">{{ anaChartTitle }}</span>
          <span style="font-size:11px;color:var(--text-3)">{{ anaChartN }}</span>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:11px">
          <sc-for list="{{ anaTierChips }}" as="c" hint-placeholder-count="17">
            <button type="button" onClick="{{ onAnaTier }}" data-v="{{ c.v }}" style="padding:5px 11px;border:none;border-radius:999px;background:{{ c.bg }};color:{{ c.fg }};font-size:11px;font-weight:700;cursor:pointer;box-shadow:{{ c.sh }}">{{ c.n }}</button>
          </sc-for>
          <sc-if value="{{ anaBMore }}">
            <button type="button" onClick="{{ onAnaMoreB }}" style="padding:5px 11px;border:1px dashed var(--border-2);border-radius:999px;background:var(--card-2);color:var(--accent-deep);font-size:11px;font-weight:700;cursor:pointer">更多 ▾</button>
          </sc-if>
        </div>
        <sc-if value="{{ anaChartOk }}">
          <svg data-chart="border" viewBox="0 0 {{ anaChartW }} {{ anaChartH }}" style="width:100%;height:auto;display:block;overflow:visible;touch-action:none;cursor:crosshair;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none">
            <defs><linearGradient id="bdFill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="var(--accent)" stop-opacity=".26"/><stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
            </linearGradient></defs>
            <line x1="{{ anaChartGX1 }}" y1="{{ anaChartGHi }}" x2="{{ anaChartGX2 }}" y2="{{ anaChartGHi }}" stroke="var(--border)" stroke-width="1" stroke-dasharray="3 4"></line>
            <line x1="{{ anaChartGX1 }}" y1="{{ anaChartGLo }}" x2="{{ anaChartGX2 }}" y2="{{ anaChartGLo }}" stroke="var(--border)" stroke-width="1" stroke-dasharray="3 4"></line>
            <path d="{{ anaChartArea }}" fill="url(#bdFill)"></path>
            <path d="{{ anaChartLine }}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"></path>
        <line class="cx-line" x1="0" y1="0" x2="0" y2="0" stroke="var(--accent-deep)" stroke-width="1" stroke-dasharray="2 3" style="opacity:0;transition:opacity .12s"></line>
        <circle class="cx-dot" cx="0" cy="0" r="4" fill="var(--card)" stroke="var(--accent)" stroke-width="2.4" style="opacity:0;transition:opacity .12s"></circle>
            <sc-for list="{{ anaChartTicks }}" as="t" hint-placeholder-count="3">
              <text x="{{ t.x }}" y="{{ anaChartH }}" fill="var(--text-3)" font-size="10" text-anchor="middle">{{ t.l }}</text>
            </sc-for>
          </svg>
          <div data-readout="border" style="min-height:17px;user-select:none;-webkit-user-select:none;font-size:12px;font-weight:700;color:var(--accent-deep);font-family:'M PLUS Rounded 1c';opacity:0;transition:opacity .12s;margin-top:6px">—</div>
<div style="display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--text-2);margin-top:8px">
            <span>起 <b style="color:var(--ink);font-family:'M PLUS Rounded 1c'">{{ anaChartFirst }}</b></span>
            <span>迄 <b style="color:var(--ink);font-family:'M PLUS Rounded 1c'">{{ anaChartLast }}</b></span>
            <span>期間增加 <b style="color:var(--accent-deep);font-family:'M PLUS Rounded 1c'">{{ anaChartGain }}</b></span>
            <span style="color:var(--text-3)">{{ anaChartAxis }}</span>
          <span style="color:var(--accent-deep);font-weight:800">{{ anaChartPct }}</span></div>
        </sc-if>
        <sc-if value="{{ anaChartNo }}"><div style="font-size:12px;color:var(--text-3);padding:14px 0;line-height:1.6">{{ anaChartMsg }}</div></sc-if>
      </div>
      <sc-if value="{{ anaHasMe }}">
        <div style="display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--text-2);margin-bottom:11px">
          <span>我的活動P <b style="color:var(--ink);font-family:'M PLUS Rounded 1c'">{{ anaMyScore }}</b></span>
          <span>我的時速 <b style="color:var(--ink);font-family:'M PLUS Rounded 1c'">{{ anaMySpeed }}</b></span>
        </div>
      </sc-if>
      <div style="border:1px solid var(--border);border-radius:18px;background:var(--card);box-shadow:var(--sh-xs);overflow-x:auto">
        <div style="min-width:{{ anaMinW }}">
          <div style="display:grid;grid-template-columns:{{ anaCols }};gap:8px;padding:11px 16px;border-bottom:1px solid var(--border);font-size:11px;font-weight:800;color:var(--text-3)">
            <span>段位</span><span>目前分數</span><sc-if value="{{ anaWide }}"><span style="text-align:right">實測時速</span></sc-if><sc-if value="{{ anaWide }}"><span style="text-align:center">依據</span></sc-if><span style="text-align:right">預測終線</span><span style="text-align:right">與我差距</span><sc-if value="{{ anaWide }}"><span style="text-align:right">我需時</span></sc-if>
          </div>
          <sc-for list="{{ anaBorderRows }}" as="b" hint-placeholder-count="17">
            <div style="display:grid;grid-template-columns:{{ anaCols }};gap:8px;padding:11px 16px;border-bottom:1px solid var(--border);font-size:12.5px;align-items:center">
              <span style="font-weight:800;color:var(--accent-deep);font-family:'M PLUS Rounded 1c'">{{ b.rank }}</span>
              <span style="font-family:'M PLUS Rounded 1c';font-weight:700;color:var(--ink)">{{ b.score }}</span>
              <sc-if value="{{ anaWide }}"><span style="text-align:right;font-family:'M PLUS Rounded 1c';color:var(--text-2)">{{ b.speed }}</span></sc-if>
              <sc-if value="{{ anaWide }}"><span style="text-align:center"><span style="display:inline-block;padding:2px 8px;border-radius:999px;background:{{ b.srcBg }};color:{{ b.srcFg }};font-size:10.5px;font-weight:700">{{ b.src }}</span></span></sc-if>
              <span style="text-align:right;font-family:'M PLUS Rounded 1c';font-weight:800;color:var(--ink)">{{ b.proj }}<br><span title="{{ b.refTip }}" style="font-size:10px;font-weight:600;color:{{ b.refFg }};cursor:help">{{ b.ref }}</span></span>
              <span style="text-align:right;font-family:'M PLUS Rounded 1c';color:{{ b.gapFg }}">{{ b.gap }}</span>
              <sc-if value="{{ anaWide }}"><span style="text-align:right;font-size:11.5px;color:var(--text-3)">{{ b.need }}</span></sc-if>

    <!-- 玩家分析 -->
    <sc-if value="{{ anaIsPlayer }}">

            <span style="font-family:'M PLUS Rounded 1c';font-size:20px;font-weight:800;color:var(--accent-deep)">{{ anaPRank }}</span>
            <span style="font-size:15px;font-weight:800;color:var(--ink)">{{ anaPName }}</span>
            <span style="font-size:12.5px;color:var(--text-2)">累計 <b style="color:var(--ink);font-family:'M PLUS Rounded 1c'">{{ anaPScore }}</b></span>
            <span style="font-size:12.5px;color:var(--text-2)">上局 <b style="color:var(--ink);font-family:'M PLUS Rounded 1c'">{{ anaPLast }}</b></span>
          </div>
          <div style="display:grid;grid-template-columns:{{ anaSpdCols }};gap:8px;padding-bottom:8px;border-bottom:1px solid var(--border);font-size:11px;font-weight:800;color:var(--text-3)">
            <span>時段</span><span style="text-align:right">周回</span><sc-if value="{{ anaWide }}"><span style="text-align:right">得分</span></sc-if><span style="text-align:right">場均</span><span style="text-align:right">時速</span>
          </div>
          <sc-for list="{{ anaSpeedRows }}" as="r" hint-placeholder-count="3">
