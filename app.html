              <span style="color:var(--text-2);font-weight:700">{{ r.l }}</span>
              <span style="text-align:right;font-family:'M PLUS Rounded 1c'">{{ r.cnt }}</span>
              <sc-if value="{{ anaWide }}"><span style="text-align:right;font-family:'M PLUS Rounded 1c'">{{ r.score }}</span></sc-if>
              <span style="text-align:right;font-family:'M PLUS Rounded 1c'">{{ r.avg }}</span>
              <span style="text-align:right;font-family:'M PLUS Rounded 1c';font-weight:800;color:var(--ink)">{{ r.speed }}</span>
            </div>
          </sc-for>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px;margin-top:14px">
            <sc-for list="{{ anaInsights }}" as="i" hint-placeholder-count="5">
              <div style="border:1px solid var(--border);border-radius:13px;background:var(--card-2);padding:10px 13px">
                <div style="font-size:10.5px;color:var(--text-3);font-weight:700">{{ i.l }}</div>
                <div style="font-family:'M PLUS Rounded 1c';font-size:15px;font-weight:800;color:{{ i.fg }};margin-top:3px">{{ i.v }}</div>
              </div>
            </sc-for>
          </div>
        </div>
        <!-- 這位玩家的名次與分數走勢 -->
        <div style="border:1px solid var(--border);border-radius:20px;background:var(--card);box-shadow:var(--sh-xs);padding:17px 19px;margin-bottom:13px">
          <div style="display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:11px">
            <span style="font-size:13.5px;font-weight:800;color:var(--ink)">名次走勢</span>
            <span style="font-size:11px;color:var(--text-3)">{{ anaPSeriesMeta }}</span>
            <span style="font-size:11.5px;font-weight:700;color:{{ anaPRankFg }}">{{ anaPRankDelta }}</span>
          </div>
          <sc-if value="{{ anaPSeries }}">
            <svg data-chart="prank" viewBox="0 0 {{ anaPRkW }} {{ anaPRkH }}" style="width:100%;height:auto;display:block;overflow:visible;touch-action:none;cursor:crosshair;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none">
              <defs><linearGradient id="pkFill" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="var(--accent)" stop-opacity=".22"/><stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
              </linearGradient></defs>
              <line x1="{{ anaPRkGX1 }}" y1="{{ anaPRkGHi }}" x2="{{ anaPRkGX2 }}" y2="{{ anaPRkGHi }}" stroke="var(--border)" stroke-width="1" stroke-dasharray="3 4"></line>
              <line x1="{{ anaPRkGX1 }}" y1="{{ anaPRkGLo }}" x2="{{ anaPRkGX2 }}" y2="{{ anaPRkGLo }}" stroke="var(--border)" stroke-width="1" stroke-dasharray="3 4"></line>
              <path d="{{ anaPRkLine }}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"></path>
        <line class="cx-line" x1="0" y1="0" x2="0" y2="0" stroke="var(--accent-deep)" stroke-width="1" stroke-dasharray="2 3" style="opacity:0;transition:opacity .12s"></line>
        <circle class="cx-dot" cx="0" cy="0" r="4" fill="var(--card)" stroke="var(--accent)" stroke-width="2.4" style="opacity:0;transition:opacity .12s"></circle>
              <sc-for list="{{ anaPRkTicks }}" as="tk" hint-placeholder-count="3">
                <text x="{{ tk.x }}" y="{{ anaPRkH }}" fill="var(--text-3)" font-size="10" text-anchor="middle">{{ tk.l }}</text>
              </sc-for>
            </svg>
            <div data-readout="prank" style="min-height:17px;user-select:none;-webkit-user-select:none;font-size:12px;font-weight:700;color:var(--accent-deep);font-family:'M PLUS Rounded 1c';opacity:0;transition:opacity .12s;margin-top:6px">—</div>
<div style="display:flex;gap:15px;flex-wrap:wrap;font-size:11.5px;color:var(--text-2);margin-top:7px">
              <span>起 <b style="color:var(--ink);font-family:'M PLUS Rounded 1c'">{{ anaPRkFirst }}</b></span>
              <span>迄 <b style="color:var(--ink);font-family:'M PLUS Rounded 1c'">{{ anaPRkLast }}</b></span>
              <span style="color:var(--text-3)">{{ anaPRkAxis }}（上方為前段）</span>
            </div>

            <sc-if value="{{ anaPHasScore }}">
              <div style="font-size:13.5px;font-weight:800;color:var(--ink);margin:16px 0 9px;padding-top:13px;border-top:1px solid var(--border)">活動P 走勢</div>
              <svg data-chart="pscore" viewBox="0 0 {{ anaPScW }} {{ anaPScH }}" style="width:100%;height:auto;display:block;overflow:visible;touch-action:none;cursor:crosshair;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none">
                <line x1="{{ anaPScGX1 }}" y1="{{ anaPScGHi }}" x2="{{ anaPScGX2 }}" y2="{{ anaPScGHi }}" stroke="var(--border)" stroke-width="1" stroke-dasharray="3 4"></line>
                <line x1="{{ anaPScGX1 }}" y1="{{ anaPScGLo }}" x2="{{ anaPScGX2 }}" y2="{{ anaPScGLo }}" stroke="var(--border)" stroke-width="1" stroke-dasharray="3 4"></line>
                <path d="{{ anaPScArea }}" fill="url(#pkFill)"></path>
                <path d="{{ anaPScLine }}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"></path>
        <line class="cx-line" x1="0" y1="0" x2="0" y2="0" stroke="var(--accent-deep)" stroke-width="1" stroke-dasharray="2 3" style="opacity:0;transition:opacity .12s"></line>
        <circle class="cx-dot" cx="0" cy="0" r="4" fill="var(--card)" stroke="var(--accent)" stroke-width="2.4" style="opacity:0;transition:opacity .12s"></circle>
                <sc-for list="{{ anaPScTicks }}" as="tk" hint-placeholder-count="3">
                  <text x="{{ tk.x }}" y="{{ anaPScH }}" fill="var(--text-3)" font-size="10" text-anchor="middle">{{ tk.l }}</text>
                </sc-for>
              </svg>
              <div data-readout="pscore" style="min-height:17px;user-select:none;-webkit-user-select:none;font-size:12px;font-weight:700;color:var(--accent-deep);font-family:'M PLUS Rounded 1c';opacity:0;transition:opacity .12s;margin-top:6px">—</div>
<div style="display:flex;gap:15px;flex-wrap:wrap;font-size:11.5px;color:var(--text-2);margin-top:7px">
                <span>起 <b style="color:var(--ink);font-family:'M PLUS Rounded 1c'">{{ anaPScFirst }}</b></span>
                <span>迄 <b style="color:var(--ink);font-family:'M PLUS Rounded 1c'">{{ anaPScLast }}</b></span>
                <span>期間增加 <b style="color:var(--accent-deep);font-family:'M PLUS Rounded 1c'">{{ anaPScoreGain }}</b></span>
                <span style="color:var(--text-3)">{{ anaPScAxis }}</span>
              <span style="color:var(--accent-deep);font-weight:800">{{ anaPScPct }}</span></div>
            </sc-if>
          </sc-if>
          <sc-if value="{{ anaPNoSeries }}"><div style="font-size:12px;color:var(--text-3);line-height:1.6;padding:6px 0">{{ anaPSeriesMsg }}</div></sc-if>
        </div>

        <div style="border:1px solid var(--border);border-radius:20px;background:var(--card);box-shadow:var(--sh-xs);padding:17px 19px;margin-bottom:13px">
          <div style="font-size:13.5px;font-weight:800;color:var(--ink);margin-bottom:11px">與各段榜線的距離</div>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px">
            <sc-for list="{{ anaBorderGap }}" as="g" hint-placeholder-count="17">
              <div style="border:1px solid var(--border);border-radius:12px;background:var(--card-2);padding:9px 12px;font-size:11.5px">
                <div style="display:flex;justify-content:space-between"><b style="color:var(--accent-deep);font-family:'M PLUS Rounded 1c'">{{ g.rank }}</b><span style="color:var(--text-3)">{{ g.score }}</span></div>
                <div style="display:flex;justify-content:space-between;margin-top:4px"><span style="color:{{ g.fg }};font-family:'M PLUS Rounded 1c';font-weight:700">{{ g.gap }}</span><span style="color:var(--text-3)">{{ g.need }}</span></div>
              </div>
            </sc-for>
          </div>
        </div>
      </sc-if>
      <div style="border:1px solid var(--border);border-radius:20px;background:var(--card);box-shadow:var(--sh-xs);padding:17px 19px">
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:11px">
          <div style="font-size:13.5px;font-weight:800;color:var(--ink);flex:1;min-width:120px">挑一位前百玩家</div>
          <button type="button" onClick="{{ onAnaMe }}" style="padding:8px 15px;border:none;border-radius:999px;background:var(--cta);color:#fff;font-size:12px;font-weight:700;cursor:pointer">分析我自己</button>
        </div>
        <input type="text" placeholder="搜尋名稱或名次…" value="{{ anaQ }}" onInput="{{ onField }}" data-k="anaQ" style="width:100%;padding:10px 15px;border:1.5px solid var(--border);border-radius:999px;background:var(--card-2);color:var(--text);font-size:13px;outline:none;margin-bottom:10px" style-focus="border-color:var(--accent)">
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:7px;max-height:290px;overflow-y:auto">
          <sc-for list="{{ anaPickRows }}" as="p" hint-placeholder-count="12">
            <button type="button" onClick="{{ onAnaPick }}" data-uid="{{ p.uid }}" style="text-align:left;padding:9px 12px;border:1px solid var(--border);border-radius:11px;background:{{ p.bg }};color:{{ p.fg }};font-size:12px;font-weight:700;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ p.n }}</button>
          </sc-for>
        </div>
        <div style="font-size:11.5px;color:var(--text-3);margin-top:9px">{{ anaPlayerMsg }}</div>
      </div>
    </sc-if>

    <!-- 活躍分析 -->
    <sc-if value="{{ anaIsActive }}">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:11px;margin-bottom:14px">
        <sc-for list="{{ anaActRows }}" as="a" hint-placeholder-count="4">
          <div style="border:1px solid var(--border);border-radius:16px;background:var(--card);box-shadow:var(--sh-xs);padding:14px 16px">
            <div style="font-size:11px;color:var(--text-3);font-weight:700">{{ a.l }}</div>
            <div style="font-family:'M PLUS Rounded 1c';font-size:23px;font-weight:800;color:var(--accent-deep);margin-top:3px">{{ a.v }}</div>
            <div style="font-size:10.5px;color:var(--text-3);margin-top:2px">{{ a.sub }}</div>
          </div>
        </sc-for>
      </div>

      <div style="border:1px solid var(--border);border-radius:20px;background:var(--card);box-shadow:var(--sh-xs);padding:17px 19px;margin-bottom:13px">
        <div style="font-size:13.5px;font-weight:800;color:var(--ink);margin-bottom:3px">此刻最快</div>
        <div style="font-size:11.5px;color:var(--text-3);margin-bottom:11px">依近 1 小時時速排序</div>
        <sc-for list="{{ anaFast }}" as="f" hint-placeholder-count="10">
          <div style="display:grid;grid-template-columns:{{ anaFastCols }};gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:12.5px;align-items:center">
            <span style="font-weight:800;color:var(--accent-deep);font-family:'M PLUS Rounded 1c'">{{ f.rank }}</span>
            <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);font-weight:700">{{ f.name }}</span>
            <span style="text-align:right;font-family:'M PLUS Rounded 1c';font-weight:800">{{ f.s1 }}</span>
            <sc-if value="{{ anaWide }}"><span style="text-align:right;font-family:'M PLUS Rounded 1c';color:var(--text-2)">{{ f.cnt }}</span></sc-if>
            <sc-if value="{{ anaWide }}"><span style="text-align:right;font-size:11px;color:var(--text-3)">{{ f.seen }}</span></sc-if>
          </div>
        </sc-for>
      </div>

      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:13px">
        <div style="border:1px solid var(--border);border-radius:20px;background:var(--card);box-shadow:var(--sh-xs);padding:17px 19px">
          <div style="font-size:13.5px;font-weight:800;color:#3ea76a;margin-bottom:3px">衝刺中</div>
          <div style="font-size:11.5px;color:var(--text-3);margin-bottom:10px">近 1 小時比自己的日均快 1.2 倍以上</div>
          <sc-for list="{{ anaSurge }}" as="x" hint-placeholder-count="6">
            <div style="display:grid;grid-template-columns:52px minmax(0,1fr) 70px;gap:7px;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px;align-items:center">
              <span style="font-weight:800;color:var(--accent-deep);font-family:'M PLUS Rounded 1c'">{{ x.rank }}</span>
              <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ x.name }}</span>
              <span style="text-align:right;font-family:'M PLUS Rounded 1c';font-weight:800;color:#3ea76a">{{ x.ratio }}</span>
            </div>
          </sc-for>
          <sc-if value="{{ anaSurgeEmpty }}"><div style="font-size:12px;color:var(--text-3);padding:10px 0">目前沒有明顯衝刺的玩家。</div></sc-if>
        </div>
        <div style="border:1px solid var(--border);border-radius:20px;background:var(--card);box-shadow:var(--sh-xs);padding:17px 19px">
          <div style="font-size:13.5px;font-weight:800;color:#e0576a;margin-bottom:3px">降速中</div>
          <div style="font-size:11.5px;color:var(--text-3);margin-bottom:10px">近 1 小時掉到日均的一半以下</div>
          <sc-for list="{{ anaCool }}" as="x" hint-placeholder-count="6">
            <div style="display:grid;grid-template-columns:52px minmax(0,1fr) 70px;gap:7px;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px;align-items:center">
              <span style="font-weight:800;color:var(--accent-deep);font-family:'M PLUS Rounded 1c'">{{ x.rank }}</span>
              <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ x.name }}</span>
              <span style="text-align:right;font-family:'M PLUS Rounded 1c';font-weight:800;color:#e0576a">{{ x.ratio }}</span>
            </div>
          </sc-for>
          <sc-if value="{{ anaCoolEmpty }}"><div style="font-size:12px;color:var(--text-3);padding:10px 0">目前沒有明顯降速的玩家。</div></sc-if>
        </div>
      </div>
    </sc-if>

    <!-- 生涯紀錄 -->
    <sc-if value="{{ anaIsHistory }}">
      <div style="border:1px solid var(--border);border-radius:20px;background:var(--card);box-shadow:var(--sh-xs);padding:17px 19px;margin-bottom:13px">

      <sc-if value="{{ tutHintOpen }}">
        <div style="padding:0 17px 15px">
          <sc-for list="{{ tutHintRows }}" as="t" hint-placeholder-count="3">
            <div style="padding:11px 0;border-top:1px solid var(--border)">
              <div style="font-size:12.5px;font-weight:800;color:var(--ink);margin-bottom:5px">{{ t.q }}</div>
              <div style="font-size:12px;color:var(--text-2);line-height:1.8">{{ t.body }}</div>
            </div>
          </sc-for>
          <button type="button" onClick="{{ onGo }}" data-p="tut" style="margin-top:11px;padding:7px 15px;border:1px solid var(--border);border-radius:999px;background:var(--card-2);color:var(--text-2);font-size:11.5px;font-weight:700;cursor:pointer">教學大全還有 {{ tutHintMore }} 則 →</button>
        </div>
      </sc-if>
    </div>
  </sc-if>

  </div>
</main>
</div><!-- /shell：固定浮層移出 flex 容器，避免行動版網址列/視窗變動時底部欄位移 -->

<!-- ========== 全局音樂播放器（收合式浮動） ========== -->
<sc-if value="{{ playerOn }}">
<!-- 同上：fixed 元素本身不加 transform / will-change，避免 iOS 捲動時脫鉤 -->
<div style="position:fixed;right:12px;bottom:{{ playerBottom }};z-index:59">

  <!-- 收合：浮動唱片圓鈕 -->
  <sc-if value="{{ playerMin }}">
    <button type="button" onClick="{{ onPlayerMin }}" title="展開播放器" style="position:relative;width:60px;height:60px;border:none;border-radius:50%;padding:0;cursor:pointer;background:var(--cta);box-shadow:0 8px 26px rgba(37,125,220,.42);overflow:hidden">
      <img src="{{ playerJktUrl }}" referrerpolicy="no-referrer" onerror="this.style.display='none'" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%;animation:{{ playerSpin }}">
      <span style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:24px;height:24px;border-radius:50%;background:rgba(10,14,28,.5)"></span>
      <span style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex"><svg viewBox="0 0 24 24" width="13" height="13" fill="#fff" style="display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))"><path d="{{ playIconPath }}"></path></svg></span>
    </button>

  <!-- 展開：播放器卡片 -->
  <sc-if value="{{ playerExpanded }}">
  <div style="width:min(324px,calc(100vw - 24px));padding:12px;border-radius:22px;background:var(--card);border:1px solid var(--border);box-shadow:var(--sh-lg);animation:popIn .3s cubic-bezier(.34,1.45,.44,1)">
    <div style="display:flex;align-items:center;gap:11px">
      <div style="width:46px;height:46px;flex:none;border-radius:12px;overflow:hidden;background:var(--card-2);box-shadow:var(--sh-xs)">
        <img src="{{ playerJktUrl }}" referrerpolicy="no-referrer" onerror="this.style.display='none'" style="width:100%;height:100%;object-fit:cover;display:block">
      </div>
      <div style="min-width:0;flex:1">
        <div style="font-size:13px;font-weight:800;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ playerCur }}</div>
        <div style="font-size:10.5px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px">{{ playerSub }}</div>
      </div>
      <button type="button" onClick="{{ onPlayerMin }}" title="收合" style="width:28px;height:28px;flex:none;border:none;border-radius:50%;background:var(--card-2);color:var(--text-2);cursor:pointer;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:block"><path d="M6 9.5l6 6 6-6"></path></svg></button>
      <button type="button" onClick="{{ onPlayerStop }}" title="關閉" style="width:28px;height:28px;flex:none;border:none;border-radius:50%;background:var(--card-2);color:var(--text-3);cursor:pointer;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="display:block"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>
    <div style="display:flex;align-items:center;justify-content:center;gap:15px;margin-top:12px">
      <button type="button" onClick="{{ onPlayerPrev }}" title="上一首" style="width:34px;height:34px;border:none;border-radius:50%;background:var(--card-2);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" style="display:block"><path d="M7 5h2.3v14H7z"></path><path d="M20 5v14L9.6 12z"></path></svg></button>
      <button type="button" onClick="{{ onPlayerToggle }}" title="播放／暫停" style="width:46px;height:46px;border:none;border-radius:50%;background:var(--cta);color:#fff;cursor:pointer;box-shadow:0 4px 15px rgba(37,125,220,.36);display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" width="20" height="20" fill="#fff" style="display:block"><path d="{{ playIconPath }}"></path></svg></button>
      <button type="button" onClick="{{ onPlayerNext }}" title="下一首" style="width:34px;height:34px;border:none;border-radius:50%;background:var(--card-2);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" style="display:block"><path d="M14.7 5H17v14h-2.3z"></path><path d="M4 5v14l10.4-7z"></path></svg></button>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:11px;border-top:1px solid var(--border)">
      <span style="font-size:10px;font-weight:800;color:var(--text-3);letter-spacing:.5px;flex:none">音源</span>
      <div style="display:inline-flex;gap:3px;padding:3px;border:1px solid var(--border);border-radius:999px;background:var(--card-2);flex:none">
        <button type="button" onClick="{{ onVocalPref }}" data-v="virtual" title="虛擬歌手 ver." style="padding:5px 12px;border:none;border-radius:999px;background:{{ vpVBg }};color:{{ vpVFg }};font-size:11px;font-weight:800;cursor:pointer">虛擬</button>
        <button type="button" onClick="{{ onVocalPref }}" data-v="sekai" title="世界 ver.（如有）" style="padding:5px 12px;border:none;border-radius:999px;background:{{ vpSBg }};color:{{ vpSFg }};font-size:11px;font-weight:800;cursor:pointer">世界</button>
      </div>
      <span style="font-size:10px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ vocalNote }}</span>
    </div>
    <div style="margin-top:11px">
      <div style="font-size:10px;font-weight:800;color:var(--text-3);letter-spacing:.5px;margin-bottom:7px">選團連播</div>
      <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:3px">
        <sc-for list="{{ playerUnitChips }}" as="u" hint-placeholder-count="7">
          <button type="button" onClick="{{ onPlayerUnit }}" data-u="{{ u.u }}" style="flex:none;padding:6px 12px;border:1px solid {{ u.bd }};border-radius:999px;background:{{ u.bg }};color:{{ u.fg }};font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap">{{ u.n }}</button>
        </sc-for>
      </div>
    </div>
  </div>
  </sc-if>

</div>
</sc-if>

<!-- ========== 行動版 dock ========== -->
<sc-if value="{{ isMobile }}">
<!-- 外層只負責定位：不能有 transform / filter / will-change，
     這三個在 iOS Safari 上會把 fixed 元素變成合成層，動量捲動或
     網址列收合時就會脫鉤亂飄。視覺效果全部下放到內層。 -->
<div style="position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;justify-content:center;pointer-events:none">
  <div style="display:flex;gap:2px;padding:5px;border-radius:999px;background:var(--card);border:1px solid var(--border);box-shadow:var(--sh-md);pointer-events:auto">
    <sc-for list="{{ dockItems }}" as="d" hint-placeholder-count="5">
      <button type="button" onClick="{{ onDock }}" data-p="{{ d.id }}" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:62px;height:50px;border:none;border-radius:999px;background:{{ d.bg }};color:{{ d.fg }};font-size:10px;font-weight:800;letter-spacing:.6px;cursor:pointer;transition:background .25s,color .2s,transform .25s cubic-bezier(.34,1.45,.44,1)" style-active="transform:scale(.9)">
        <span style="width:8px;height:8px;border-radius:50%;background:{{ d.dot }}"></span>{{ d.name }}
      </button>
    </sc-for>
  </div>
</div>
</sc-if>

<!-- ========== 更多（行動版彈層） ========== -->
<sc-if value="{{ sheetOpen }}">
<div onClick="{{ onSheetClose }}" style="position:fixed;inset:0;z-index:70;background:rgba(10,14,28,.45);backdrop-filter:blur(6px);animation:fadeIn .3s ease"></div>
<div style="position:fixed;left:10px;right:10px;bottom:10px;z-index:71;padding:12px 16px calc(18px + env(safe-area-inset-bottom,0px));border:1px solid var(--border);border-radius:26px;background:color-mix(in oklab,var(--card) 95%,transparent);backdrop-filter:blur(24px);box-shadow:var(--sh-lg);max-height:76vh;overflow-y:auto;animation:sheetUp .5s cubic-bezier(.34,1.45,.44,1)">
  <div style="width:38px;height:5px;border-radius:3px;background:var(--border-2);margin:2px auto 8px"></div>
  <sc-for list="{{ navGroups }}" as="grp" hint-placeholder-count="4">
    <div style="font-size:10.5px;font-weight:800;letter-spacing:2.4px;color:var(--text-3);margin:14px 4px 8px">{{ grp.label }}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <sc-for list="{{ grp.items }}" as="it" hint-placeholder-count="3">
        <button type="button" onClick="{{ onGo }}" data-p="{{ it.id }}" style="display:flex;align-items:center;gap:9px;min-height:48px;padding:10px 15px;border:1px solid var(--border);border-radius:15px;background:{{ it.bg }};color:{{ it.fg }};font-size:13.5px;font-weight:700;cursor:pointer;text-align:left;box-shadow:var(--sh-xs);transition:transform .2s cubic-bezier(.34,1.45,.44,1)" style-active="transform:scale(.96)">
          <span style="width:8px;height:8px;border-radius:50%;flex:none;background:{{ it.dot }}"></span>{{ it.name }}
        </button>
      </sc-for>
    </div>
  </sc-for>
  <div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--border);font-size:12px;color:var(--text-3);line-height:1.9">
    <a href="index.html">經典長頁版 ↗</a> · <a href="ep-calculator.html">EP 計算器 ↗</a> · <a href="tutorial.html">教學大全 ↗</a>
  </div>
</div>
</sc-if>

<!-- ========== 排名詳情（點排名列） ========== -->
<sc-if value="{{ detailOpen }}">
<div onClick="{{ onDetailClose }}" style="position:fixed;inset:0;z-index:74;background:rgba(10,14,28,.45);backdrop-filter:blur(6px);animation:fadeIn .3s ease"></div>
<div style="position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:75;width:min(560px,calc(100vw - 24px));max-height:82vh;overflow-y:auto;padding:20px;border:1px solid var(--border);border-radius:22px;background:color-mix(in oklab,var(--card) 96%,transparent);backdrop-filter:blur(24px);box-shadow:var(--sh-lg);animation:popCenter .3s cubic-bezier(.34,1.4,.44,1)">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px">
    <span style="font-size:16px;font-weight:800;color:var(--ink)">{{ detailData.title }}</span>
    <button type="button" onClick="{{ onDetailClose }}" style="width:30px;height:30px;flex:none;border:1px solid var(--border);border-radius:999px;background:var(--card);color:var(--text-2);font-size:14px;cursor:pointer">✕</button>
  </div>
  <div style="display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--text-2);margin-bottom:14px">
    <span>總分 <b style="color:var(--ink);font-family:'M PLUS Rounded 1c'">{{ detailData.score }}</b></span>
    <span>上局 <b style="color:var(--ink);font-family:'M PLUS Rounded 1c'">{{ detailData.lastScore }}</b></span>
    <span>1h均速 <b style="color:var(--ink);font-family:'M PLUS Rounded 1c'">{{ detailData.speed1h }}</b></span>
    <span>最後 <b style="color:var(--ink)">{{ detailData.lastPlayed }}</b></span>
  </div>
  <sc-if value="{{ detailData.hasUid }}">
    <button type="button" onClick="{{ onRankDeck }}" data-uid="{{ detailData.uid }}" style="width:100%;margin-bottom:14px;padding:11px;border:none;border-radius:13px;background:var(--cta);color:#fff;font-size:13.5px;font-weight:800;cursor:pointer;box-shadow:0 4px 14px rgba(37,125,220,.26)">查看這位玩家的編組與加成 →</button>
  </sc-if>
  <div style="overflow-x:auto"><div style="min-width:400px">
    <div style="display:grid;grid-template-columns:1.1fr .9fr 1fr 1fr .9fr;gap:2px;font-size:11px;color:var(--text-3);font-weight:700;padding:0 4px 6px">
      <span>時段</span><span style="text-align:right">周回</span><span style="text-align:right">時段得分</span><span style="text-align:right">場均</span><span style="text-align:right">時速</span>
    </div>
    <sc-for list="{{ detailData.rows }}" as="pr" hint-placeholder-count="3">
      <div style="display:grid;grid-template-columns:1.1fr .9fr 1fr 1fr .9fr;gap:2px;padding:9px 4px;border-top:1px solid var(--border);font-size:13px;font-family:'M PLUS Rounded 1c'">
        <span style="color:var(--text-2);font-family:'Huninn'">{{ pr.label }}</span>
        <span style="text-align:right">{{ pr.count }}</span>
        <span style="text-align:right">{{ pr.score }}</span>
        <span style="text-align:right;color:var(--accent-deep)">{{ pr.avg }}</span>
        <span style="text-align:right">{{ pr.speed }}</span>
      </div>
    </sc-for>
  </div></div>

  <!-- 名次走勢，直接接在詳情下方 -->
  <div style="margin-top:15px;padding-top:14px;border-top:1px solid var(--border)">
    <div style="display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:9px">
      <span style="font-size:13px;font-weight:800;color:var(--ink)">名次走勢</span>
      <span style="font-size:11px;color:var(--text-3)">{{ detailData.chartMeta }}</span>
    </div>
    <sc-if value="{{ detailData.hasChart }}">
      <svg data-chart="rankpos" viewBox="0 0 {{ detailData.chartW }} {{ detailData.chartH }}" style="width:100%;height:auto;display:block;overflow:visible;touch-action:none;cursor:crosshair;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none">
        <defs><linearGradient id="rkFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--accent)" stop-opacity=".26"/><stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
        </linearGradient></defs>
        <line x1="{{ detailData.chartGX1 }}" y1="{{ detailData.chartGHi }}" x2="{{ detailData.chartGX2 }}" y2="{{ detailData.chartGHi }}" stroke="var(--border)" stroke-width="1" stroke-dasharray="3 4"></line>
        <line x1="{{ detailData.chartGX1 }}" y1="{{ detailData.chartGLo }}" x2="{{ detailData.chartGX2 }}" y2="{{ detailData.chartGLo }}" stroke="var(--border)" stroke-width="1" stroke-dasharray="3 4"></line>
        <path d="{{ detailData.chartArea }}" fill="url(#rkFill)"></path>
        <path d="{{ detailData.chartLine }}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"></path>
        <line class="cx-line" x1="0" y1="0" x2="0" y2="0" stroke="var(--accent-deep)" stroke-width="1" stroke-dasharray="2 3" style="opacity:0;transition:opacity .12s"></line>
        <circle class="cx-dot" cx="0" cy="0" r="4" fill="var(--card)" stroke="var(--accent)" stroke-width="2.4" style="opacity:0;transition:opacity .12s"></circle>
        <sc-for list="{{ detailData.chartTicks }}" as="tk" hint-placeholder-count="3">
          <text x="{{ tk.x }}" y="{{ detailData.chartH }}" fill="var(--text-3)" font-size="10" text-anchor="middle">{{ tk.l }}</text>
        </sc-for>
      </svg>
      <div data-readout="rankpos" style="min-height:17px;user-select:none;-webkit-user-select:none;font-size:12px;font-weight:700;color:var(--accent-deep);font-family:'M PLUS Rounded 1c';opacity:0;transition:opacity .12s;margin-top:6px">—</div>
<div style="display:flex;gap:15px;flex-wrap:wrap;font-size:11.5px;color:var(--text-2);margin-top:7px">
        <span>起 <b style="color:var(--ink);font-family:'M PLUS Rounded 1c'">{{ detailData.chartFirst }}</b></span>
        <span>迄 <b style="color:var(--ink);font-family:'M PLUS Rounded 1c'">{{ detailData.chartLast }}</b></span>
        <span>期間增加 <b style="color:var(--accent-deep);font-family:'M PLUS Rounded 1c'">{{ detailData.chartGain }}</b></span>
        <span style="color:var(--text-3)">{{ detailData.chartAxis }}</span>
      <span style="color:var(--accent-deep);font-weight:800">{{ detailData.chartPct }}</span></div>
    </sc-if>
    <sc-if value="{{ detailData.chartNo }}">
      <div style="font-size:12px;color:var(--text-3);line-height:1.6;padding:8px 0">{{ detailData.chartMsg }}</div>
    </sc-if>
  </div>

  <!-- 逐局紀錄：一個小點就是一場，橫向滑動看完整期 -->
  <div style="margin-top:15px;padding-top:14px;border-top:1px solid var(--border)">
    <div style="display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:9px">
      <span style="font-size:13px;font-weight:800;color:var(--ink)">逐局紀錄</span>
      <span style="font-size:11px;color:var(--text-3)">每個點是一場，點一下看該場加了多少</span>
    </div>

    <sc-if value="{{ detailData.gamesOn }}">
      <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px">
        <sc-for list="{{ detailData.gamesRangeChips }}" as="c" hint-placeholder-count="6">
          <button type="button" onClick="{{ onGamesRange }}" data-v="{{ c.v }}" style="padding:5px 11px;border:none;border-radius:999px;background:{{ c.bg }};color:{{ c.fg }};font-size:11px;font-weight:700;cursor:pointer;box-shadow:{{ c.sh }}">{{ c.n }}</button>
        </sc-for>
      </div>
      <!-- 日期：跨天時只看時:分分不出是哪天，括號內是那天的場數 -->
      <sc-if value="{{ detailData.gamesHasDays }}">
        <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px">
          <sc-for list="{{ detailData.gamesDayChips }}" as="c" hint-placeholder-count="4">
            <button type="button" onClick="{{ onGamesRange }}" data-v="{{ c.v }}" style="padding:5px 11px;border:none;border-radius:999px;background:{{ c.bg }};color:{{ c.fg }};font-size:11px;font-weight:700;cursor:pointer;box-shadow:{{ c.sh }};font-family:'M PLUS Rounded 1c'">{{ c.n }}</button>
          </sc-for>
        </div>
      </sc-if>
      <div style="font-size:11px;color:var(--text-3);margin-bottom:10px;font-family:'M PLUS Rounded 1c'">{{ detailData.gamesSpan }}</div>

      <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-bottom:11px">
        <sc-for list="{{ detailData.gamesStats }}" as="st" hint-placeholder-count="4">
          <div style="border:1px solid var(--border);border-radius:12px;background:var(--card-2);padding:8px 10px">
            <div style="font-size:10px;color:var(--text-3);font-weight:700">{{ st.l }}</div>
            <div style="font-family:'M PLUS Rounded 1c';font-size:14px;font-weight:800;color:var(--ink);margin-top:2px">{{ st.v }}</div>
          </div>
        </sc-for>
      </div>

      <!-- 點多的時候不聚合、改成橫向捲動，每一場都保留得到。
           左右箭頭逐場切換，比用手指點小圓點準得多（尤其手機）。 -->
      <div style="display:flex;align-items:center;gap:8px">
        <button type="button" onClick="{{ onGamesPrev }}" title="上一場" style="flex:none;width:34px;height:34px;border:1px solid var(--border);border-radius:11px;background:var(--card);color:var(--accent-deep);font-size:15px;font-weight:800;cursor:pointer;line-height:1">‹</button>
        <div id="gamesTrack" style="flex:1;min-width:0;overflow-x:auto;overflow-y:hidden;padding:6px 2px;border:1px solid var(--border);border-radius:14px;background:var(--card-2);-webkit-overflow-scrolling:touch">
          <div style="display:flex;align-items:center;min-height:30px">
            <sc-for list="{{ detailData.gamesDots }}" as="g" hint-placeholder-count="40">
              <!-- 外層是觸控區（夠大好按），內層才是視覺上的小圓點 -->
              <button type="button" onClick="{{ onGamesPick }}" data-i="{{ g.i }}" data-gdot="{{ g.i }}" title="{{ g.title }}" style="flex:none;width:18px;height:30px;padding:0;border:none;background:transparent;cursor:pointer;display:grid;place-items:center">
                <span style="display:block;width:{{ g.size }};height:{{ g.size }};border-radius:50%;background:{{ g.bg }};box-shadow:{{ g.ring }};transition:width .15s,height .15s"></span>
              </button>
            </sc-for>
          </div>
        </div>
        <button type="button" onClick="{{ onGamesNext }}" title="下一場" style="flex:none;width:34px;height:34px;border:1px solid var(--border);border-radius:11px;background:var(--card);color:var(--accent-deep);font-size:15px;font-weight:800;cursor:pointer;line-height:1">›</button>
      </div>

      <sc-if value="{{ detailData.gamesHasPick }}">
        <div style="margin-top:9px;padding:10px 13px;border-radius:12px;background:color-mix(in oklab,var(--accent) 12%,transparent)">
          <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">
            <span style="color:var(--accent-deep);font-size:13.5px;font-weight:800;font-family:'M PLUS Rounded 1c'">{{ detailData.gamesPickInfo }}</span>
            <span style="flex:none;color:var(--text-3);font-size:11px;font-family:'M PLUS Rounded 1c'">{{ detailData.gamesPickNo }}</span>
          </div>
          <div style="font-size:11.5px;color:var(--text-2);margin-top:3px">{{ detailData.gamesPickSub }}</div>
        </div>
      </sc-if>
      <div style="font-size:11px;color:var(--text-3);margin-top:8px;line-height:1.6">{{ detailData.gamesNote }}</div>
    </sc-if>

    <sc-if value="{{ detailData.gamesBusy }}">
      <div style="font-size:12px;color:var(--text-3);padding:10px 0">載入逐局紀錄…</div>
    </sc-if>
    <sc-if value="{{ detailData.gamesMsg }}">
      <div style="font-size:12px;color:var(--text-3);line-height:1.6;padding:8px 0">{{ detailData.gamesMsg }}</div>
    </sc-if>
  </div>

  <div style="font-size:11px;color:var(--text-3);margin-top:13px;line-height:1.6">周回＝該時段遊玩局數；時段得分＝該時段累積活動P；場均＝每局平均得分；時速＝每小時活動P。資料 HiSekai，僅前 100 名有逐時段細節。走勢圖記的是該名次位置的分數變化（玩家會在名次之間移動），由伺服器每 30 分鐘累積一筆。逐局紀錄由本站自行採樣，涵蓋前 100 名，且從開始追蹤那一刻起算、不回溯。</div>
</div>
</sc-if>

<!-- ========== 我的編組詳情（自動算加成） ========== -->
<sc-if value="{{ deckOpen }}">
<div onClick="{{ onDeckClose }}" style="position:fixed;inset:0;z-index:76;background:rgba(10,14,28,.45);backdrop-filter:blur(6px);animation:fadeIn .3s ease"></div>
<div style="position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:77;width:min(600px,calc(100vw - 24px));max-height:88vh;overflow-y:auto;padding:16px 18px;border:1px solid var(--border);border-radius:22px;background:color-mix(in oklab,var(--card) 96%,transparent);backdrop-filter:blur(24px);box-shadow:var(--sh-lg);animation:popCenter .3s cubic-bezier(.34,1.4,.44,1)">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px">
    <span style="font-size:15px;font-weight:800;color:var(--ink)">{{ deckTitle }}</span>
    <button type="button" onClick="{{ onDeckClose }}" style="width:30px;height:30px;flex:none;border:1px solid var(--border);border-radius:999px;background:var(--card);color:var(--text-2);font-size:14px;cursor:pointer">✕</button>
  </div>
  <iframe id="deckInfoFrame" data-src="{{ deckSrc }}" title="我的編組" scrolling="no" style="width:100%;height:520px;border:none;background:transparent;display:block"></iframe>
</div>
</sc-if>

<!-- ========== 卡池詳情（PU 卡面/技能） ========== -->
<sc-if value="{{ gachaOpen }}">
<div onClick="{{ onGachaClose }}" style="position:fixed;inset:0;z-index:76;background:rgba(10,14,28,.45);backdrop-filter:blur(6px);animation:fadeIn .3s ease"></div>
<div style="position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:77;width:min(620px,calc(100vw - 24px));max-height:88vh;overflow-y:auto;padding:16px 18px;border:1px solid var(--border);border-radius:22px;background:color-mix(in oklab,var(--card) 96%,transparent);backdrop-filter:blur(24px);box-shadow:var(--sh-lg);animation:popCenter .3s cubic-bezier(.34,1.4,.44,1)">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px">
    <span style="font-size:15px;font-weight:800;color:var(--ink)">卡池 · PU 卡面/技能</span>
    <button type="button" onClick="{{ onGachaClose }}" style="width:30px;height:30px;flex:none;border:1px solid var(--border);border-radius:999px;background:var(--card);color:var(--text-2);font-size:14px;cursor:pointer">✕</button>
  </div>
  <iframe id="gachaInfoFrame" data-src="{{ gachaSrc }}" title="卡池詳情" scrolling="no" style="width:100%;height:400px;border:none;background:transparent;display:block"></iframe>
</div>
</sc-if>

<!-- ========== 歌曲詳情（封面＋各難度） ========== -->
<sc-if value="{{ songOpen }}">
<div onClick="{{ onSongClose }}" style="position:fixed;inset:0;z-index:76;background:rgba(10,14,28,.45);backdrop-filter:blur(6px);animation:fadeIn .3s ease"></div>
<div style="position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:77;width:min(500px,calc(100vw - 24px));max-height:88vh;overflow-y:auto;padding:18px;border:1px solid var(--border);border-radius:22px;background:color-mix(in oklab,var(--card) 96%,transparent);backdrop-filter:blur(24px);box-shadow:var(--sh-lg);animation:popCenter .3s cubic-bezier(.34,1.4,.44,1)">
  <div style="display:flex;align-items:flex-start;gap:14px;margin-bottom:14px">
    <img src="{{ songDetailData.jacket }}" referrerpolicy="no-referrer" onerror="this.style.opacity=.15" style="width:88px;height:88px;flex:none;border-radius:14px;object-fit:cover;border:1px solid var(--border)">
    <div style="min-width:0;flex:1">
      <div style="font-size:16px;font-weight:800;color:var(--ink);line-height:1.35">{{ songDetailData.title }}</div>
      <div style="font-size:12px;color:var(--text-3);margin-top:2px">{{ songDetailData.composer }}</div>
      <div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:8px"><sc-for list="{{ songDetailData.units }}" as="u" hint-placeholder-count="1"><span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;background:{{ u.c }};color:{{ u.t }}">{{ u.n }}</span></sc-for></div>
    </div>
    <button type="button" onClick="{{ onSongClose }}" style="width:30px;height:30px;flex:none;border:1px solid var(--border);border-radius:999px;background:var(--card);color:var(--text-2);font-size:14px;cursor:pointer">✕</button>
  </div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:8px;margin-bottom:13px">
    <sc-for list="{{ songDetailData.diffs }}" as="d" hint-placeholder-count="5">
      <div style="border:1px solid var(--border);border-radius:12px;padding:9px 6px;text-align:center;background:var(--card-2)">
        <div style="font-size:9.5px;font-weight:800;letter-spacing:.4px;color:{{ d.c }}">{{ d.n }}</div>
        <div style="font-size:19px;font-weight:800;color:var(--ink);font-family:'M PLUS Rounded 1c'">Lv{{ d.lv }}</div>
        <div style="font-size:9.5px;color:var(--text-3)">{{ d.notes }}</div>
      </div>
    </sc-for>
  </div>
  <button type="button" onClick="{{ onPlaySong }}" data-abn="{{ songDetailData.abn }}" style="width:100%;padding:11px;border:none;border-radius:12px;background:var(--cta);color:#fff;font-weight:800;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px"><svg viewBox="0 0 24 24" width="15" height="15" fill="#fff" style="display:block"><path d="M8 5v14l11-7z"></path></svg>試聽（全曲版）</button>
</div>
</sc-if>

<!-- ========== 收集室：項目詳情 ========== -->
<sc-if value="{{ colPickOpen }}">
<div onClick="{{ onColClose }}" style="position:fixed;inset:0;z-index:76;background:rgba(10,14,28,.45);backdrop-filter:blur(6px);animation:fadeIn .3s ease"></div>
<div style="position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:77;width:min(420px,calc(100vw - 28px));max-height:86vh;overflow-y:auto;padding:18px;border:1px solid var(--border);border-radius:22px;background:var(--card);box-shadow:var(--sh-lg);animation:popCenter .32s cubic-bezier(.34,1.45,.44,1)">
  <div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:12px">
    <div style="flex:1;min-width:0">
      <div style="font-size:16px;font-weight:800;color:var(--ink);line-height:1.4">{{ colPickData.name }}</div>
      <div style="font-size:11.5px;color:var(--text-3);margin-top:3px">{{ colPickData.group }}</div>
    </div>
    <button type="button" onClick="{{ onColClose }}" aria-label="關閉" style="width:30px;height:30px;flex:none;display:grid;place-items:center;border:1px solid var(--border);border-radius:999px;background:var(--card);color:var(--text-2);cursor:pointer">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
  </div>
  <div style="border:1px solid var(--border);border-radius:14px;background:var(--card-2);padding:14px;display:grid;place-items:center;min-height:120px">
    <img src="{{ colPickData.img }}" referrerpolicy="no-referrer" decoding="async" alt="" style="max-width:100%;max-height:280px;object-fit:contain;display:block">
  </div>
  <sc-if value="{{ colIsHonor }}">
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
      <span style="font-size:11px;font-weight:700;padding:4px 11px;border-radius:999px;background:var(--card-2);color:var(--text-2)">稀有度 {{ colPickData.rarityLabel }}</span>
      <span style="font-size:11px;font-weight:700;padding:4px 11px;border-radius:999px;background:var(--card-2);color:var(--text-2)">{{ colPickData.lvCount }} 個等級</span>
    </div>
  </sc-if>
  <div style="font-size:12.5px;color:var(--text-2);line-height:1.75;margin-top:12px">{{ colPickData.desc }}</div>
</div>
</sc-if>

<!-- ========== ⌘K 指令面板 ========== -->
<sc-if value="{{ cmdkOpen }}">
<div onClick="{{ onCmdClose }}" style="position:fixed;inset:0;z-index:90;background:rgba(10,14,28,.45);backdrop-filter:blur(10px) saturate(1.2);animation:fadeIn .25s ease"></div>
<div style="position:fixed;left:50%;top:8vh;transform:translateX(-50%);z-index:91;width:min(640px,calc(100vw - 24px));max-height:78vh;display:flex;flex-direction:column;border:1px solid var(--border);border-radius:22px;background:var(--bg-soft);box-shadow:var(--sh-lg);overflow:hidden;animation:popIn .4s cubic-bezier(.34,1.45,.44,1)">
  <div style="display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)">
    <svg viewBox="0 0 20 20" fill="none" style="width:17px;height:17px;color:var(--text-3);flex:none"><circle cx="9" cy="9" r="5.5" stroke="currentColor" stroke-width="2"></circle><path d="M13.5 13.5L17 17" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>
    <input type="text" placeholder="搜尋卡池、歌曲、功能，或輸入指令（例：ep 1500000）" value="{{ cmdq }}" onInput="{{ onCmdInput }}" onKeyDown="{{ onCmdKey }}" ref="{{ cmdRef }}" style="flex:1;border:none;outline:none;background:transparent;color:var(--text);font-size:15.5px;padding:4px 2px">
    <button type="button" onClick="{{ onCmdClose }}" aria-label="關閉" style="width:30px;height:30px;flex:none;display:grid;place-items:center;border:none;border-radius:50%;background:var(--card-2);color:var(--text-2);font-size:16px;cursor:pointer">✕</button>
  </div>
  <div style="padding:7px 18px;border-bottom:1px solid var(--border);background:var(--card-2);font-size:11px;color:var(--text-3)">↑↓ 選擇 · Enter 執行 · Esc 關閉　指令：<b>ep 分數</b>、<b>加成 250</b>、<b>綜合力 280000</b>、<b>火 10</b></div>
  <div style="overflow-y:auto;padding:6px 0">
    <sc-for list="{{ cmdResults }}" as="r" hint-placeholder-count="6">
      <button type="button" onClick="{{ onCmdPick }}" data-i="{{ r.i }}" style="display:flex;align-items:center;gap:11px;width:100%;padding:11px 18px;border:none;background:{{ r.bg }};cursor:pointer;text-align:left;transition:background .14s">
        <span style="flex:none;font-size:10px;font-weight:800;padding:3px 9px;border-radius:999px;color:#fff;background:{{ r.tagBg }}">{{ r.tag }}</span>
        <span style="flex:1;min-width:0;font-size:14px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ r.main }}</span>
        <span style="flex:none;font-size:11px;color:var(--text-3);font-family:'M PLUS Rounded 1c'">{{ r.sub }}</span>
      </button>
    </sc-for>
    <sc-if value="{{ cmdEmpty }}">
      <div style="padding:34px 18px;text-align:center;color:var(--text-3);font-size:13px">找不到符合的結果</div>
    </sc-if>
  </div>
</div>
</sc-if>

</template></x-dc>
