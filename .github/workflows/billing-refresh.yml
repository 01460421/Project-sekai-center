name: 儲值商品資料更新

# 商城商品(水晶包/禮包/通行證)隨活動檔期上下架,每天重建一次 data/billing.js。
# build 腳本內容沒變就不寫檔,所以多數日子這裡是空跑、不會產生提交。
on:
  schedule:
    - cron: '17 19 * * *'   # 每日 19:17 UTC ≈ 台北 03:17
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: billing-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 重建 data/billing.js
        run: python3 tools/build-billing.py

      - name: 重建 data/b30-consts.js(定數表)
        run: python3 tools/build-b30.py || echo "定數表更新失敗,本輪略過"

      # good果汁的榜線/交換所表格、瑞憶春希的豆森娃月列表:上游更新後這裡跟著同步。
      # 兩支都是「內容沒變就不寫檔」,所以多數日子不會產生提交。
      - name: 同步社群資料表(good果汁)
        run: python3 tools/build-goodjuice.py || echo "社群榜線資料同步失敗,本輪略過"

      - name: 同步豆森娃月列表(瑞憶春希)
        run: python3 tools/sync-dolls.py || echo "豆森娃月同步失敗,本輪略過"

      # 榜線終線預測模型:用 data/history 已結束的期數重擬參數(只需 numpy),
      # 一樣是「內容沒變就不寫檔」。剛結束的期數會先去 API 補官方終線再擬。
      - name: 重擬榜線預測模型(data/border-model.json)
        run: |
          python3 -c 'import numpy' 2>/dev/null || pip3 install --quiet numpy
          python3 tools/build-border-model.py || echo "榜線模型重擬失敗,本輪略過"

      # billing.js / sekai-data.js 是長快取資源,網址帶內容雜湊;檔案一變就要重算戳記,
      # 否則 CI 的戳記檢查會紅、瀏覽器也會黏住舊檔。戳記一路串到 js 與各 HTML。
      - name: 壓縮 app.js 並重算版本戳
        run: |
          # 戳記會連鎖(ai.js → ai.min.js → app.js),一輪不一定收斂,最多跑三輪
          for i in 1 2 3; do
            python3 tools/build-min.py
            python3 tools/stamp-assets.py || true
            python3 tools/stamp-assets.py --check >/dev/null && exit 0
          done
          python3 tools/stamp-assets.py --check

      - name: 提交變更
        run: |
          if [ -z "$(git status --porcelain data/billing.js data/b30-consts.js data/borders-db.js data/sekai-data.js data/border-model.json tools/border_model/finals.json js/app.js js/app.min.js js/ai.js js/ai.min.js js/core.js index.html app.html ep-calculator.html tutorial.html)" ]; then
            echo "沒有新資料，不提交"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/billing.js data/b30-consts.js data/borders-db.js data/sekai-data.js data/border-model.json tools/border_model/finals.json js/app.js js/app.min.js js/ai.js js/ai.min.js js/core.js index.html app.html ep-calculator.html tutorial.html
          git commit -m "商城/定數資料 $(date -u '+%Y-%m-%d') [skip ci]"
          # 與榜線快照同款:落後就先 rebase 再推
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
