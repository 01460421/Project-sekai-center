name: 儲值商品資料更新

# 商城商品(水晶包/禮包/通行證)隨活動檔期上下架,每天重建一次 data/billing.js。
# build 腳本內容沒變就不寫檔,所以多數日子這裡是空跑、不會產生提交。
on:
  schedule:
    - cron: '17 19 * * *'   # 每日 19:17 UTC ≈ 台北 03:17
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: billing-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # 日服 event-info／卡池列表多抓 resourceBoxes 35 MB、gachas 49 MB（快取沒中時）
    steps:
      - uses: actions/checkout@v4

      - name: 重建 data/billing.js
        run: python3 tools/build-billing.py

      - name: 重建 data/b30-consts.js(定數表)
        run: python3 tools/build-b30.py || echo "定數表更新失敗,本輪略過"

      # good果汁的榜線/交換所表格、瑞憶春希的豆森娃月列表:上游更新後這裡跟著同步。
      # 兩支都是「內容沒變就不寫檔」,所以多數日子不會產生提交。
      - name: 同步社群資料表(good果汁)
        run: python3 tools/build-goodjuice.py || echo "社群榜線資料同步失敗,本輪略過"

      - name: 同步豆森娃月列表(瑞憶春希)
        run: python3 tools/sync-dolls.py || echo "豆森娃月同步失敗,本輪略過"

      # 榜線終線預測模型:用 data/history 已結束的期數重擬參數(只需 numpy),
      # 一樣是「內容沒變就不寫檔」。剛結束的期數會先去 API 補官方終線再擬。
      - name: 重擬榜線預測模型(data/border-model.json)
        run: |
          python3 -c 'import numpy' 2>/dev/null || pip3 install --quiet numpy
          python3 tools/build-border-model.py || echo "榜線模型重擬失敗,本輪略過"

      # 理論技能倍率表：兩服 master 有新卡就會變，一樣「內容沒變就不寫檔」。
      # 日服 cards.json 有 34 MB：以上游 HEAD commit 當 key 快取，commit 沒變的日子不重抓。
      - name: 日服 master 版本
        id: jprev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha=$(curl -sS -H "authorization: Bearer $GITHUB_TOKEN" https://api.github.com/repos/Sekai-World/sekai-master-db-diff/commits/main | python3 -c 'import json,sys; print((json.load(sys.stdin).get("sha") or "none")[:12])' || echo none)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: tools/.cache/jp-master
          key: jp-master-${{ steps.jprev.outputs.sha }}
      - name: 重算理論技能倍率表(data/skill-table.js)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/build-skill-table.py || echo "理論技能倍率表重算失敗,本輪略過"

      # 卡池詳情的 PU 卡：同樣讀日服 master（gachas.json 49 MB 也走上面的快取），內容沒變就不寫檔。
      - name: 重算卡池 PU 卡(data/gacha-pickups.js)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/build-gacha-pickups.py || echo "卡池 PU 卡重算失敗,本輪略過"

      # 網站切到日服時的卡池列表（形狀同 sekai-data.js 的 GACHAS）與它的 PU 卡：日服 gachas.json 49 MB 走上面的快取。
      # 只放在這支每日排程，不要搬進半小時一次的榜線快照。
      - name: 日服卡池列表與 PU 卡(data/gachas-jp.js、data/gacha-pickups-jp.js)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/build-gachas-jp.py || echo "日服卡池列表重算失敗,本輪略過"
          MASTER_SRV=jp python3 tools/build-gacha-pickups.py || echo "日服卡池 PU 卡重算失敗,本輪略過"
      # 日服抽卡模擬的卡池（近 13 個月＋進行中與已排好的池，壓成約 60 KB）：gachas.json 49 MB、cards.json 34 MB 都走上面的快取。
      - name: 日服抽卡模擬卡池(data/gachasim-jp.js)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/build-gachasim-jp.py || echo "日服抽卡模擬卡池重算失敗,本輪略過"

      # 活動資料頁與甘特圖的活動資料：台服 master 的活動、加成、活動卡、排名獎勵（resourceBoxDetails 26 MB 在這裡攤平），內容沒變就不寫檔。
      - name: 重算活動資料(data/event-info.js)
        run: python3 tools/build-event-info.py || echo "活動資料重算失敗,本輪略過"
      # 日服版（MASTER_SRV=jp）：日服 master 沒有 resourceBoxDetails，改攤平 resourceBoxes.json（35 MB，走同一份快取）。
      - name: 重算日服活動資料(data/event-info-jp.js)
        env:
          MASTER_SRV: jp
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/build-event-info.py || echo "日服活動資料重算失敗,本輪略過"
      # 儲值分析的日服版（MASTER_SRV=jp，日圓定價）：一樣攤平 resourceBoxes.json（走同一份快取）；台服的官網 GamePay 商店不抓。內容沒變就不寫檔。
      - name: 重建日服商城資料(data/billing-jp.js)
        env:
          MASTER_SRV: jp
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/build-billing.py || echo "日服商城資料重建失敗,本輪略過"
      - name: 排程預測（日服加一年的規律：逐期回測與未來活動／卡池）
        run: python3 tools/build-schedule-forecast.py || echo "排程預測重算失敗,本輪略過"
      # 網站切到日服時的現況（版本、近期活動、開放中的卡池、新曲）：日服 master 走同一份快取，內容沒變就不寫檔。
      - name: 日服現況(data/jp-now.js)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/build-jp-now.py || echo "日服現況重算失敗,本輪略過"
      # WL3 綜合力計算器：各期總合力上限、滿配候選隊、卡片三維、區域道具每級加成（日服 master 同一份快取；台服上限讀 Haruki 台服 master）
      - name: WL3 綜合力計算器資料(data/wl3-power.js)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/build-wl3-power.py || echo "WL3 綜合力資料重算失敗,本輪略過"
      # 排名頭像：卡號 → 角色（日服 master 同一份快取）；新卡進 master 隔天排名就有頭像
      - name: 排名頭像對照(data/card-chara.js)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/build-card-chara.py || echo "排名頭像對照重算失敗,本輪略過"
      # 日服版榜線資料庫（形狀同 data/borders-db.js）：終線抓過就存在 tools/border_model/jp-finals.json，
      # 每天只去 Sekai Viewer／Haruki 補新結束的期數；活動資訊走上面同一份日服 master 快取，內容沒變就不寫檔。
      - name: 日服榜線資料庫(data/borders-db-jp.js)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/build-borders-db-jp.py || echo "日服榜線資料庫重算失敗,本輪略過"

      # 只提交資料檔；版本戳在 rebase 到最新 main 之後才重算（見 tools/commit-data.sh），
      # 取樣期間 main 有新提交也不會在 app.html / app.min.js 上撞衝突。
      - name: 提交變更
        run: bash tools/commit-data.sh "商城/定數資料 $(date -u '+%Y-%m-%d')" data/billing.js data/b30-consts.js data/borders-db.js data/sekai-data.js data/border-model.json tools/border_model/finals.json data/skill-table.js data/gacha-pickups.js data/event-info.js data/schedule-forecast.js data/jp-now.js data/gachas-jp.js data/gacha-pickups-jp.js data/event-info-jp.js data/billing-jp.js data/borders-db-jp.js tools/border_model/jp-finals.json data/gachasim-jp.js data/wl3-power.js data/card-chara.js
