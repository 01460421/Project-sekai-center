name: worker-push-setup
# 一鍵設定瀏覽器推播（Web Push）的 VAPID 金鑰：在 runner 裡產一組金鑰、直接放進 Cloudflare Worker 的機密，
# 金鑰不會印在 log、也不會進 git；順便套用 sql/015_push.sql（可重複跑）。
# 用法：Actions 頁 → worker-push-setup → Run workflow；這個檔案第一次合進 main 時也會自動跑一次。
# 已經設過就會跳過（不會換掉金鑰，否則所有裝置的訂閱都會失效）；真的要換一組金鑰才手動跑並勾 rotate。
# 需要跟 worker-deploy 同一組 repo secrets：CLOUDFLARE_API_TOKEN（範本「Edit Cloudflare Workers」要含 D1 編輯）、CLOUDFLARE_ACCOUNT_ID。
on:
  push:
    branches: [main]
    paths: ['.github/workflows/worker-push-setup.yml']
  workflow_dispatch:
    inputs:
      rotate:
        description: '已經有金鑰也重新產一組（會讓現有裝置的推播訂閱全部失效）'
        type: boolean
        default: false
      subject:
        description: 'VAPID_SUBJECT（選用，mailto:你的信箱；留空用預設）'
        type: string
        default: ''
concurrency:
  group: worker-deploy
  cancel-in-progress: false
jobs:
  setup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: 確認已設定 Cloudflare 金鑰
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::還沒設定 CLOUDFLARE_API_TOKEN／CLOUDFLARE_ACCOUNT_ID（見 worker-deploy.yml 開頭說明）。"
            exit 1
          fi
      - name: 已經設過金鑰？
        id: have
        run: |
          if npx --yes wrangler secret list | grep -q '"VAPID_PUBLIC"'; then
            echo "have=true" >> "$GITHUB_OUTPUT"
            if [ "${{ inputs.rotate }}" = "true" ]; then
              echo "VAPID_PUBLIC 已存在，rotate=true：會換一組新金鑰（現有裝置的訂閱會失效，要重新開啟推播）。"
            else
              echo "VAPID_PUBLIC 已存在，跳過產金鑰（要換一組才勾 rotate）。"
            fi
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
          fi
      - name: 套用資料表（sql/015_push.sql，可重複跑）
        run: |
          # CREATE … IF NOT EXISTS 本來就可重跑；ALTER TABLE 加欄位只有欄位還不在時才跑，不然 D1 會報 duplicate column
          npx --yes wrangler d1 execute pjsk-users --remote -y --command "CREATE TABLE IF NOT EXISTS push_subs (id TEXT PRIMARY KEY, user_id TEXT NOT NULL, endpoint TEXT NOT NULL UNIQUE, p256dh TEXT, auth TEXT, ua TEXT, created_at INTEGER NOT NULL, fail_n INTEGER NOT NULL DEFAULT 0); CREATE INDEX IF NOT EXISTS idx_push_user ON push_subs(user_id);"
          if npx --yes wrangler d1 execute pjsk-users --remote -y --json --command "PRAGMA table_info(events)" | grep -q '"pushed_at"'; then
            echo "events.pushed_at 已存在"
          else
            npx --yes wrangler d1 execute pjsk-users --remote -y --command "ALTER TABLE events ADD COLUMN pushed_at INTEGER"
            echo "已加上 events.pushed_at"
          fi
      - name: 產金鑰並放進 Worker 機密
        if: steps.have.outputs.have != 'true' || inputs.rotate
        run: |
          # 金鑰只存在 runner 的記憶體與這個暫存檔，結束就刪；add-mask 保證就算哪裡印到也會被遮掉
          npx --yes web-push@3 generate-vapid-keys --json > "$RUNNER_TEMP/vapid.json"
          PUB=$(node -p 'JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/vapid.json","utf8")).publicKey')
          PRIV=$(node -p 'JSON.parse(require("fs").readFileSync(process.env.RUNNER_TEMP + "/vapid.json","utf8")).privateKey')
          echo "::add-mask::$PUB"; echo "::add-mask::$PRIV"
          [ "${#PUB}" = 87 ] && [ "${#PRIV}" = 43 ] || { echo "::error::產出的金鑰長度不對（${#PUB}／${#PRIV}）"; exit 1; }
          printf '%s' "$PUB"  | npx --yes wrangler secret put VAPID_PUBLIC
          printf '%s' "$PRIV" | npx --yes wrangler secret put VAPID_PRIVATE
          rm -f "$RUNNER_TEMP/vapid.json"
      - name: VAPID_SUBJECT（選用）
        if: inputs.subject != ''
        run: printf '%s' "${{ inputs.subject }}" | npx --yes wrangler secret put VAPID_SUBJECT
      - name: 確認網站看得到推播已開
        working-directory: .
        run: |
          # secret put 會自動發一版新的 Worker，等它上線；/api/watch-kinds 不用登入就看得到 capabilities.push
          for i in $(seq 1 12); do
            if curl -fsS https://games.project-sekai-center.com/api/watch-kinds | grep -q '"push":true'; then
              echo "推播已啟用：我的帳號 → 偵測訂閱 → 「開啟瀏覽器推播」可以按了。"; exit 0
            fi
            sleep 5
          done
          echo "::error::60 秒後 /api/watch-kinds 仍回 push:false，請到 Cloudflare 儀表板確認 VAPID_PUBLIC／VAPID_PRIVATE 有沒有存進去。"
          exit 1
