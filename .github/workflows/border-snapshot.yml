name: 榜線快照

# 台服沒有現成的榜線時序來源，只能自己定時記。
# GitHub 的排程觸發極不準時（實測 */30 實際間隔 1.5～3.5 小時），
# 所以不靠排程密度，改成一次觸發後在同一個 job 內自己連續取樣 55 分鐘，
# 每 5 分鐘記一筆，最後一次提交。這樣不管排程延遲多久，資料密度都固定。
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:        # 也可以手動觸發補一筆

permissions:
  contents: write

concurrency:
  group: border-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: 連續取樣 55 分鐘（每 5 分鐘一筆）
        run: |
          # 注意：GitHub 用 bash -e 跑，步驟最後一個指令的結束碼就是步驟結果。
          # 原本寫 [ "$i" -lt 12 ] && sleep 300，最後一圈條件為假就回 1，
          # 明明資料寫成功卻整步失敗。改用 if，並在最後明確 exit 0。
          ok=0
          for i in $(seq 1 12); do
            if python3 tools/record-border.py; then
              ok=$((ok+1))
            else
              echo "第 $i 次取樣失敗，繼續下一次"
            fi
            if [ "$i" -lt 12 ]; then sleep 300; fi
          done
          echo "本輪成功 $ok / 12 次"
          # 取樣失敗不該讓 job 失敗；真正該擋的是下一步的資料缺損檢查
          exit 0

      # 順帶重建儲值商品資料(活動限時商品才能近即時上架;前端從 raw 直接吃這份)。
      # 失敗不影響榜線快照。
      - name: 更新儲值商品資料
        run: python3 tools/build-billing.py || echo "儲值資料更新失敗,本輪略過"

      # 紀錄只增不減。提交前比對每個檔案與 HEAD 的樣本數，
      # 少了或不見了就讓整個 job 失敗，絕不把缺損推上去。
      - name: 確認沒有任何紀錄減少
        run: |
          python3 - <<'PY'
          import json, subprocess, sys, pathlib
          bad = []
          for p in sorted(pathlib.Path('data/history').glob('*.json')):
              if p.name == 'index.json':
                  continue
              try:
                  new = len(json.loads(p.read_text())['samples'])
              except Exception as e:
                  bad.append(f'{p}: 新檔無法解析 {e}'); continue
              r = subprocess.run(['git', 'show', f'HEAD:{p}'], capture_output=True, text=True)
              if r.returncode:
                  print(f'{p}: 新檔案，{new} 筆'); continue
              old = len(json.loads(r.stdout)['samples'])
              if new < old:
                  bad.append(f'{p}: 樣本從 {old} 掉到 {new}')
              else:
                  print(f'{p}: {old} → {new} 筆')
          # HEAD 有、工作區沒有 = 檔案被刪掉了
          head = subprocess.run(['git','ls-tree','--name-only','HEAD','data/history/'],
                                capture_output=True, text=True).stdout.split()
          for name in head:
              if not pathlib.Path(name).is_file():
                  bad.append(f'{name}: 檔案消失')
          if bad:
              print('偵測到紀錄缺損，中止：', *bad, sep='\n  ', file=sys.stderr)
              sys.exit(1)
          PY

      # billing.js / sekai-data.js 是長快取資源,網址帶內容雜湊;檔案一變就要重算戳記,
      # 否則 CI 的戳記檢查會紅、瀏覽器也會黏住舊檔。戳記一路串到 js 與各 HTML。
      - name: 壓縮 app.js 並重算版本戳
        run: |
          # 戳記會連鎖(ai.js → ai.min.js → app.js),一輪不一定收斂,最多跑三輪
          for i in 1 2 3; do
            python3 tools/build-min.py
            python3 tools/stamp-assets.py || true
            python3 tools/stamp-assets.py --check >/dev/null && exit 0
          done
          python3 tools/stamp-assets.py --check

      - name: 提交變更
        run: |
          if [ -z "$(git status --porcelain data/history data/billing.js js/app.js js/app.min.js js/ai.js js/ai.min.js js/core.js index.html app.html ep-calculator.html tutorial.html)" ]; then
            echo "沒有新資料，不提交"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history data/billing.js js/app.js js/app.min.js js/ai.js js/ai.min.js js/core.js index.html app.html ep-calculator.html tutorial.html
          git commit -m "榜線快照 $(date -u '+%Y-%m-%d %H:%M') UTC [skip ci]"
          # 併發或落後時先 rebase 再推，避免整條排程卡住
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
