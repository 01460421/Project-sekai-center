name: worker-deploy
# 把 worker/ 部署到 Cloudflare（games.project-sekai-center.com）。
# 觸發：main 上 worker/ 有變動時自動跑；也可以在 Actions 頁手動按「Run workflow」。
#
# 一次性設定（repo → Settings → Secrets and variables → Actions → New repository secret）：
#   CLOUDFLARE_API_TOKEN   Cloudflare → My Profile → API Tokens → Create Token → 範本「Edit Cloudflare Workers」，
#                          Account Resources 選你的帳戶、Zone Resources 選 project-sekai-center.com。
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare 儀表板 → Workers & Pages 右側欄的 Account ID。
# Worker 自己的機密（HARUKI_API_TOKEN、SESSION_SECRET 等）存在 Cloudflare，不必放進 GitHub；部署不會動到它們。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['worker/**']
concurrency:
  group: worker-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: 確認已設定 Cloudflare 金鑰
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::還沒設定 CLOUDFLARE_API_TOKEN／CLOUDFLARE_ACCOUNT_ID（見本檔開頭說明），這次不部署。"
            exit 1
          fi
      - name: 部署前先跑 Worker 測試
        run: |
          for f in worker/src/*.js; do node --check "$f"; done
          node worker/test/haruki.mjs
          node worker/test/security.mjs
      - name: 部署
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler deploy
      - name: 部署後確認
        run: |
          sleep 5
          curl -fsS https://games.project-sekai-center.com/haruki/config
          echo
          curl -fsS -o /dev/null -w "/cal/sekai.ics %{http_code}\n" https://games.project-sekai-center.com/cal/sekai.ics
