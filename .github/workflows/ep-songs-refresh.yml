name: EP 曲庫更新

# 計算中心與摸魚表用的曲庫(data/ep-songs.js)。
# 原本是一次性從 ep-calculator.html 抽出來的靜態檔,沒有更新機制,新歌一直進不來。
#
# 為什麼獨立成一支而不是塞進「儲值商品資料更新」:那支的名字講的是商城,
# 曲庫跟商城沒有關係,混在一起會讓人看不懂為什麼要去那裡按重跑;
# 而且分開之後想單獨重跑曲庫不必連商城一起跑。
on:
  schedule:
    - cron: '40 19 * * *'   # 每日 19:40 UTC ≈ 台北 03:40（錯開商城那支的 19:17）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ep-songs-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # 腳本內建自我校驗:重建結果跟舊檔對不上就會自己中止、不寫檔。
      # 這裡不吞錯誤 —— 校驗擋下來是要讓人看到的,靜靜略過就失去意義了。
      - name: 重建曲庫
        run: python3 tools/build-ep-songs.py

      # 歌曲 BPM 來自社長 bot（t-wy）的公開資料庫,跟曲庫同一支排程更新;失敗不影響曲庫。
      - name: 重建歌曲 BPM
        run: python3 tools/build-song-bpm.py || echo "BPM 資料更新失敗,本輪略過"

      # 星圖（starmap.html）的歌曲詮釋資料：團體、發行日、作曲與音源名。要在曲庫之後跑（它依曲庫的曲目清單建），
      # 否則新歌進了曲庫卻沒有詮釋資料，在星圖會退化成「其他／未定」。失敗不影響曲庫。
      - name: 重建星圖詮釋資料
        run: python3 tools/build-song-meta.py || echo "星圖詮釋資料更新失敗,本輪略過"

      # 虛擬 Live、MySekai 家具與劇情目錄的索引（原檔各 1~3 MB，壓成小檔）。內容沒變就不寫檔。
      - name: 重建圖鑑索引（虛擬 Live／家具／劇情目錄）
        run: python3 tools/build-db-index.py || echo "圖鑑索引更新失敗,本輪略過"

      # 日服版圖鑑索引（MASTER_SRV=jp → lives-index-jp.js 等，網站切到日服時用）。日服 virtualLives.json 有 16 MB，
      # 跟商城那支一樣以上游 HEAD commit 當 key 快取 tools/.cache/jp-master，commit 沒變的日子不重抓。
      - name: 日服 master 版本
        id: jprev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha=$(curl -sS -H "authorization: Bearer $GITHUB_TOKEN" https://api.github.com/repos/Sekai-World/sekai-master-db-diff/commits/main | python3 -c 'import json,sys; print((json.load(sys.stdin).get("sha") or "none")[:12])' || echo none)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: tools/.cache/jp-master
          key: jp-master-${{ steps.jprev.outputs.sha }}
      - name: 重建日服圖鑑索引
        env:
          MASTER_SRV: jp
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/build-db-index.py || echo "日服圖鑑索引更新失敗,本輪略過"

      # 卡片索引（收集率、卡片圖鑑、卡面下載、日服編組預覽用），兩服都產。以前沒有排程，日服那份停在 9/19（少了 30 張新卡）。
      # 新卡的素材有沒有上架要實際問素材庫（最後 300 張），內容沒變就不會有差異；失敗只略過。
      - name: 重建卡片索引（台服＋日服）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/build-cards-index.py || echo "卡片索引更新失敗,本輪略過"

      # 只提交資料檔；版本戳在 rebase 到最新 main 之後才重算（見 tools/commit-data.sh）。
      # 以前先在舊的 checkout 上重算戳記、再 rebase 推送，會把期間別的排程更新過的戳記蓋回舊值，
      # main 的戳記檢查因此變紅（2026-09-28 那次蓋掉了 data-built.js、support-events.js 的戳記）。
      # build-db-index.py 也寫 mysekai-events.js、support-events.js、data-built.js，以前漏在清單外（每天產生後被丟掉），一起補上。
      - name: 提交變更
        run: bash tools/commit-data.sh "曲庫資料 $(date -u '+%Y-%m-%d')" data/ep-songs.js data/ep-song-windows.js data/song-bpm.js data/song-meta.js data/lives-index.js data/fixtures-index.js data/stories-index.js data/mysekai-talks-index.js data/mysekai-events.js data/support-events.js data/data-built.js data/lives-index-jp.js data/fixtures-index-jp.js data/stories-index-jp.js data/mysekai-talks-index-jp.js data/mysekai-events-jp.js data/support-events-jp.js data/data-built-jp.js data/cards-index.js data/cards-index-jp.js data/cards-extra.js data/cards-extra-jp.js
