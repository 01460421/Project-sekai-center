name: EP 曲庫更新

# 計算中心與摸魚表用的曲庫(data/ep-songs.js)。
# 原本是一次性從 ep-calculator.html 抽出來的靜態檔,沒有更新機制,新歌一直進不來。
#
# 為什麼獨立成一支而不是塞進「儲值商品資料更新」:那支的名字講的是商城,
# 曲庫跟商城沒有關係,混在一起會讓人看不懂為什麼要去那裡按重跑;
# 而且分開之後想單獨重跑曲庫不必連商城一起跑。
on:
  schedule:
    - cron: '40 19 * * *'   # 每日 19:40 UTC ≈ 台北 03:40（錯開商城那支的 19:17）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ep-songs-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # 腳本內建自我校驗:重建結果跟舊檔對不上就會自己中止、不寫檔。
      # 這裡不吞錯誤 —— 校驗擋下來是要讓人看到的,靜靜略過就失去意義了。
      - name: 重建曲庫
        run: python3 tools/build-ep-songs.py

      # 曲庫是 immutable 長快取,網址帶內容雜湊。檔案一變戳記就要跟著重算,
      # 否則瀏覽器會黏住改版前的曲庫整整一年。
      # 戳記會從 data → js/app.js → 各 HTML 一路串下去,所以提交範圍要含這些。
      - name: 重算版本戳
        run: python3 tools/stamp-assets.py

      - name: 提交變更
        run: |
          # 只看實際存在的檔案。git status 對「不存在的 pathspec」會直接 fatal,
          # 之前就是因為 ep-song-windows.js 還沒被產生出來,整個步驟以 128 掛掉。
          FILES=""
          for f in data/ep-songs.js data/ep-song-windows.js js/app.js js/core.js \
                   index.html app.html ep-calculator.html tutorial.html; do
            [ -f "$f" ] && FILES="$FILES $f"
          done
          if [ -z "$FILES" ]; then
            echo "沒有任何檔案可提交"
            exit 0
          fi
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "曲庫內容未變，不提交"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $FILES
          git commit -m "曲庫資料 $(date -u '+%Y-%m-%d') [skip ci]"
          # 與榜線快照同款:落後就先 rebase 再推
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
