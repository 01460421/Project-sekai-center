name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: 語法檢查
        run: |
          for f in js/*.js sw.js support.js data/syslog.js data/aliases.js worker/src/*.js; do node --check "$f"; done   # 以前漏了 intro／i18n／border-model／sw 與 import().catch 載入的 syslog／aliases：語法錯了只會靜靜變空
      - name: 資料檔結構驗證（戳記、歌曲、卡片、活動、榜線、模型、準確度、歷史、更新紀錄、翻譯、日服）
        run: node tools/validate-data.mjs
      - name: 效能預算（首屏檔案 gzip 大小不能超過 tests/budget.mjs 的上限）
        run: node tests/budget.mjs
      - name: 英日翻譯缺漏不能變多（基準在 tests/i18n-gap.mjs；要先裝 acorn，--missing 自己會裝）
        run: node tests/i18n-gap.mjs
      - name: Worker 的 Haruki 轉換與路由
        run: node worker/test/haruki.mjs
      - name: Worker 的 Haruki 授權橋接（給菜根機器人；D1 用 node:sqlite 模擬）
        run: node worker/test/haruki_grant.mjs
      - name: Worker 的榜線快照（每 5 分鐘一筆、/snaps；DO 的 SQL 用 node:sqlite 模擬）
        run: node worker/test/snaps.mjs
      - name: Worker 的匿名使用統計（/t、/admin/tele）與資料管線檢查（GitHub 用假 fetch）
        run: node worker/test/telemetry.mjs
      - name: Worker 的玩家榜線回報（/contrib；D1 用 node:sqlite 模擬）
        run: node worker/test/contrib.mjs
      - name: Haruki 專區的純函式（角色任務 EXP、目前隊伍、compact 展開）
        run: node tests/haruki-zone.mjs
      - name: 壓縮檔與戳記是否過期（不改檔，過期就失敗）
        run: python3 tools/stamp-assets.py --check
      - name: 外站圖片都要帶 referrerpolicy（素材庫對帶 Referer 的請求回 403）
        run: node tests/img-referrer.mjs
      - name: 給爬蟲看的 share/ 預覽頁與 PAGES 表一致、圖都存在、vercel.json 是合法 JSON
        run: node tests/share-pages.mjs
      - name: 快取 Playwright 的瀏覽器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.48.2-chromium
      - name: 煙霧測試（桌機＋手機各 26 頁）
        run: |
          npm i --no-save --silent playwright@1.48.2 axe-core@4.10.2
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 1
          node tests/smoke.mjs
      - name: 無障礙門檻（axe-core：critical 0、serious 不超過基準）
        run: node tests/a11y.mjs
      - name: 服務工作者的導覽快取（換 ?page= 或 /songs 路徑不重抓 app.html、尾斜線 308、離線退回；腳本自己起 8766 的伺服器）
        run: node tests/sw.mjs
      - name: 理論技能倍率表「我的卡」解算器與建置結果一致
        run: node tests/skill-mine.mjs
      - name: WL3 專區資料（六期 26 章、台服時間、日服榜線、限定卡、滿配 990／985）
        run: node tests/wl3zone.mjs
      - name: 截圖辨識的卡面指紋涵蓋卡片索引裡的卡（以前停在 #1271，新卡全被認成舊卡）
        run: node tests/card-sigs.mjs
      - name: WL3 計算器（綜合力算式、想いの大樹混團兩份、大門與玩偶上限、達標等級、升級順序、後排支援隊、章節與終章主隊加成＋混團）
        run: node tests/wl3pow.mjs
  # 伺服器機器人（bot/）：核心與功能不依賴 discord.js，測試不必 npm install、不需要 token
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: 語法檢查
        working-directory: bot
        run: npm run check
      - name: 註冊表、煙霧（100 個指令＋每個按鈕）、邏輯與流程測試
        working-directory: bot
        run: npm test
      # Workers 版的打包（wrangler dry-run）：Workers 專屬的寫法（WebSocket、Durable Object）有錯，部署前就擋下來
      - name: 安裝相依套件（wrangler）
        working-directory: bot
        run: npm ci --no-audit --no-fund
      - name: Workers 版打包檢查
        working-directory: bot
        run: npx wrangler deploy --dry-run --outdir=dist
      - name: Workers 版在真的 workerd 上跑一遍（驗簽、指令、按鈕、自動完成、cron、/health）
        working-directory: bot
        run: node scripts/probe-workers.mjs
