name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: 語法檢查
        run: |
          for f in js/app.js js/ai.js js/car.js js/haruki.js js/hk-deck-worker.js js/core.js support.js worker/src/*.js; do node --check "$f"; done
      - name: Worker 的 Haruki 轉換與路由
        run: node worker/test/haruki.mjs
      - name: Worker 的 Haruki 授權橋接（給菜根機器人；D1 用 node:sqlite 模擬）
        run: node worker/test/haruki_grant.mjs
      - name: Worker 的榜線快照（每 5 分鐘一筆、/snaps；DO 的 SQL 用 node:sqlite 模擬）
        run: node worker/test/snaps.mjs
      - name: Haruki 專區的純函式（角色任務 EXP、目前隊伍、compact 展開）
        run: node tests/haruki-zone.mjs
      - name: 壓縮檔與戳記是否過期（不改檔，過期就失敗）
        run: python3 tools/stamp-assets.py --check
      - name: 外站圖片都要帶 referrerpolicy（素材庫對帶 Referer 的請求回 403）
        run: node tests/img-referrer.mjs
      - name: 快取 Playwright 的瀏覽器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.48.2-chromium
      - name: 煙霧測試（桌機＋手機各 26 頁）
        run: |
          npm i --no-save --silent playwright@1.48.2
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 1
          node tests/smoke.mjs
      - name: 理論技能倍率表「我的卡」解算器與建置結果一致
        run: node tests/skill-mine.mjs
  # 伺服器機器人（bot/）：核心與功能不依賴 discord.js，測試不必 npm install、不需要 token
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: 語法檢查
        working-directory: bot
        run: npm run check
      - name: 註冊表、煙霧（100 個指令＋每個按鈕）、邏輯與流程測試
        working-directory: bot
        run: npm test
      # Workers 版的打包（wrangler dry-run）：Workers 專屬的寫法（WebSocket、Durable Object）有錯，部署前就擋下來
      - name: 安裝相依套件（wrangler）
        working-directory: bot
        run: npm ci --no-audit --no-fund
      - name: Workers 版打包檢查
        working-directory: bot
        run: npx wrangler deploy --dry-run --outdir=dist
      - name: Workers 版在真的 workerd 上跑一遍（驗簽、指令、按鈕、自動完成、cron、/health）
        working-directory: bot
        run: node scripts/probe-workers.mjs
