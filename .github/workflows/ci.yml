name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: 語法檢查
        run: |
          for f in js/app.js js/ai.js js/core.js support.js worker/src/*.js; do node --check "$f"; done
      - name: Worker 的 Haruki 轉換與路由
        run: node worker/test/haruki.mjs
      - name: 壓縮檔與戳記是否過期（不改檔，過期就失敗）
        run: python3 tools/stamp-assets.py --check
      - name: 煙霧測試（桌機＋手機各 13 頁）
        run: |
          npm i --no-save --silent playwright@1.48.2
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 1
          node tests/smoke.mjs
