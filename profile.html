/* ===== 讀資料：HiSekai 公開檔案（台服）＋ Haruki 公開 suite（兩服） ===== */
async function fetchHs(id) {
  const r = await fetch(HS + '/user/' + id + '/profile', { headers: { Accept: 'application/json' } });
  if (!r.ok) throw new Error(r.status === 404 ? '找不到這個 ID，或玩家沒有公開個人檔案' : 'HiSekai HTTP ' + r.status);

  const total = +r.headers.get('content-length') || 0; const reader = r.body.getReader(); const chunks = []; let got = 0;

  if (hs) {

    P.power = { total: tp.totalPower || 0, basic: tp.basicCardTotalPower || 0, area: tp.areaItemBonus || 0, charRank: tp.characterRankBonus || 0, honor: tp.honorBonus || 0, fixture: tp.mysekaiFixtureGameCharacterPerformanceBonus || 0, gate: tp.mysekaiGateLevelBonus || 0 };
    (hs.userMusicDifficultyClearCount || []).forEach(d => { P.diff[d.musicDifficultyType] = { clear: d.liveClear || 0, fc: d.fullCombo || 0, ap: d.allPerfect || 0 }; });
    if (hs.userMultiLiveTopScoreCount) P.multi = { mvp: hs.userMultiLiveTopScoreCount.mvp || 0, superStar: hs.userMultiLiveTopScoreCount.superStar || 0 };

    (hasScore ? '' : '<p class="note" style="margin-bottom:8px">每位角色的分數要有 Haruki 公開 suite；這裡先用公開檔案裡的關卡進度。</p>') +
    '<div class="chars">' + rows.map(r => '<div class="ch"><img src="' + charImg(r.id) + '" alt="" loading="lazy"><div><b>' + esc(r.name) + '</b><div class="mb"><i style="width:' + (r.score / max * 100) + '%;background:' + r.color + '"></i></div><small>關卡 ' + r.done + (r.total ? '／' + r.total : '') + '</small></div><div style="text-align:right"><span class="rk" style="font-size:14px">' + (r.score ? n(r.score) : '—') + '</span></div></div>').join('') + '</div>' +
    '<p class="note" style="margin-top:10px">挑戰 Live 每位角色每天一次，分數只跟該角色的卡與技能有關；關卡獎勵（水晶、素材）是固定的，進度落後的角色先推關最划算。</p></div>';
}
function cardsPane(P) {
  if (!P.cards) return '<div class="card empty"><b>需要 Haruki 公開 suite</b>持卡清單在那裡；有了之後這裡會算各稀有度與各角色的收集率、專精與特訓數。</div>';
  const avail = CARDS.filter(c => c[9] !== 0), own = new Set(P.cards.map(c => c.id)), byR = {}, tot = {};
  avail.forEach(c => { tot[c[2]] = (tot[c[2]] || 0) + 1; if (own.has(c[0])) byR[c[2]] = (byR[c[2]] || 0) + 1; });
  const mr5 = P.cards.filter(c => c.mr >= 5).length, tr = P.cards.filter(c => c.tr).length, mrSum = P.cards.reduce((s, c) => s + c.mr, 0);
  const four = {}; avail.filter(c => c[2] === 4).forEach(c => { const f = four[c[1]] = four[c[1]] || { t: 0, o: 0 }; f.t++; if (own.has(c[0])) f.o++; });
  const chRows = Object.keys(four).map(id => ({ id: +id, name: (CH[id] || {}).name || id, color: (CH[id] || {}).color || '#888', o: four[id].o, t: four[id].t })).sort((a, b) => (b.o / b.t) - (a.o / a.t) || b.o - a.o);
  return '<div class="card"><h2>卡片 <span class="n">持有 ' + n(P.cards.length) + '／' + n(avail.length) + '（' + pct(P.cards.length, avail.length) + '）</span></h2><div class="tiles">' + [4, 3, 9, 2, 1].filter(r => tot[r]).map(r => '<div class="tile"><span>' + RAR(r) + '</span><b>' + n(byR[r] || 0) + '<span style="font-size:12px"> ／' + n(tot[r]) + '</span></b><small>' + pct(byR[r] || 0, tot[r]) + '</small></div>').join('') + '<div class="tile"><span>專精 5</span><b>' + n(mr5) + '</b><small>專精合計 ' + n(mrSum) + '</small></div><div class="tile"><span>已特訓</span><b>' + n(tr) + '</b></div></div></div>' +
    '<div class="card"><h2>各角色 4★ 收集率</h2><div class="chars">' + chRows.map(r => '<div class="ch"><img src="' + charImg(r.id) + '" alt="" loading="lazy"><div><b>' + esc(r.name) + '</b><div class="mb"><i style="width:' + (r.o / r.t * 100) + '%;background:' + r.color + '"></i></div></div><div style="text-align:right"><span class="rk" style="font-size:15px">' + r.o + '<span class="dim" style="font-size:11px">／' + r.t + '</span></span></div></div>').join('') + '</div></div>';
}
function matsPane(P) {
  if (!P.mats) return '<div class="card empty"><b>需要 Haruki 公開 suite</b>豆森材料庫存在那裡。</div>';
  const rows = P.mats.map(m => { const f = FIX_MATS[m.id] || ['素材 #' + m.id, '', '']; return { id: m.id, name: f[0], icon: f[1], rar: f[2], q: m.q, at: m.at }; }).sort((a, b) => b.q - a.q);
  const grp = {}; rows.forEach(r => (grp[r.rar] = grp[r.rar] || []).push(r));
  return '<div class="card"><h2>豆森材料 <span class="n">' + rows.length + ' 種・<a href="./mystudio.html">豆森工作室</a> 算像素畫要多少</span></h2><table><thead><tr><th>素材</th><th class="num">庫存</th><th>最近取得</th></tr></thead><tbody>' + rows.map(r => '<tr><td><span class="mat">' + (r.icon ? '<img src="' + ASSET + '/mysekai/thumbnail/material/' + r.icon + '.webp" alt="" loading="lazy">' : '') + esc(r.name) + '</span></td><td class="num">' + n(r.q) + '</td><td class="dim" style="font-size:11px">' + (r.at ? new Date(r.at).toLocaleDateString() : '—') + '</td></tr>').join('') + '</tbody></table></div>';
}
const METRICS = [
  ['玩家等級', P => P.rank], ['綜合力', P => P.power && P.power.total], ['卡片基礎綜合力', P => P.power && P.power.basic], ['區域道具加成', P => P.power && P.power.area], ['角色等級加成', P => P.power && P.power.charRank],
  ['角色平均等級', P => P.avgRank ? +P.avgRank.toFixed(1) : null], ['角色等級合計', P => { const v = Object.values(P.chars).map(c => c.rank); return v.length ? v.reduce((a, b) => a + b, 0) : null; }],
  ['多人 MVP', P => P.multi && P.multi.mvp], ['SUPERSTAR', P => P.multi && P.multi.superStar], ['挑戰 Live 最高', P => P.chal.best && P.chal.best.score], ['挑戰 Live 合計', P => { const v = Object.values(P.chal.per).map(x => x.score || 0); return v.some(Boolean) ? v.reduce((a, b) => a + b, 0) : null; }],
  ['持有卡片', P => P.cards && P.cards.length], ['專精 5 張數', P => P.cards && P.cards.filter(c => c.mr >= 5).length], ['稱號數', P => P.honors],
  ...['expert', 'master', 'append'].flatMap(d => [[DN[d] + ' 通關', P => P.diff[d] && P.diff[d].clear], [DN[d] + ' FC', P => P.diff[d] && P.diff[d].fc], [DN[d] + ' AP', P => P.diff[d] && P.diff[d].ap]]),
];
function comparePane(A, B) {
  if (!B) return '<div class="card empty"><b>要比較就在上面填第二個 ID</b>兩個帳號的等級、綜合力、FC／AP、挑戰 Live、持卡會並排，再列 26 位角色等級的差。</div>';
  let h = '<div class="card"><h2>比較 <span class="n">' + esc(A.name) + ' vs ' + esc(B.name) + '</span></h2><table class="cmp"><thead><tr><th>項目</th><th class="num">' + esc(A.name) + '</th><th class="num">' + esc(B.name) + '</th><th class="num">差</th></tr></thead><tbody>';
  METRICS.forEach(([l, f]) => { const a = f(A), b = f(B); if (a == null && b == null) return; const da = a != null && b != null ? a - b : null; h += '<tr><td>' + l + '</td><td class="a ' + (da > 0 ? 'win' : da < 0 ? 'lose' : '') + '">' + n(a) + '</td><td class="b ' + (da < 0 ? 'win' : da > 0 ? 'lose' : '') + '">' + n(b) + '</td><td class="num dim">' + (da == null ? '—' : (da > 0 ? '+' : '') + n(Math.round(da * 10) / 10)) + '</td></tr>'; });
  h += '</tbody></table></div>';
  const ids = Object.keys(CH).map(Number).filter(id => (A.chars[id] || B.chars[id]));
  if (ids.length) h += '<div class="card"><h2>角色等級</h2><table class="cmp"><thead><tr><th>角色</th><th class="num">' + esc(A.name) + '</th><th class="num">' + esc(B.name) + '</th><th class="num">差</th></tr></thead><tbody>' + ids.map(id => { const a = (A.chars[id] || {}).rank || 0, b = (B.chars[id] || {}).rank || 0, d = a - b; return '<tr><td><span class="chip"><i style="width:10px;height:10px;border-radius:3px;background:' + CH[id].color + '"></i>' + esc(CH[id].name) + '</span></td><td class="a ' + (d > 0 ? 'win' : d < 0 ? 'lose' : '') + '">' + a + '</td><td class="b ' + (d < 0 ? 'win' : d > 0 ? 'lose' : '') + '">' + b + '</td><td class="num dim">' + (d > 0 ? '+' : '') + d + '</td></tr>'; }).join('') + '</tbody></table></div>';
  return h;
}
function summaryText(P) {
  const d = P.diff, L = [P.name + '（ID ' + P.id + (P.rank ? '，Rank ' + P.rank : '') + '）'];
  if (P.power) L.push('綜合力 ' + n(P.power.total) + '（卡片 ' + n(P.power.basic) + '、區域道具 ' + n(P.power.area) + '、角色等級 ' + n(P.power.charRank) + '）');
  if (P.avgRank) L.push('角色平均等級 ' + P.avgRank.toFixed(1));
  DIFFS.filter(k => d[k]).forEach(k => L.push(DN[k] + ' 通關 ' + d[k].clear + '／FC ' + d[k].fc + '／AP ' + d[k].ap));
  if (P.multi) L.push('多人 MVP ' + n(P.multi.mvp) + (P.multi.superStar != null ? '、SUPERSTAR ' + n(P.multi.superStar) : ''));
  if (P.chal.best) L.push('挑戰 Live 最高 ' + n(P.chal.best.score) + '（' + ((CH[P.chal.best.id] || {}).name || '') + '）');
  if (P.cards) L.push('持有卡片 ' + n(P.cards.length) + ' 張');
  L.push('— project-sekai-center.com/profile?id=' + P.id);
  return L.join('\n');
}
/* ===== 啟動 ===== */
const q = new URLSearchParams(location.search);
if (q.get('srv') === 'jp') { SRV = 'jp'; $('#srv').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.v === 'jp'))); }
let pid = q.get('id') || ''; try { pid = pid || localStorage.getItem('sekai-profile-last') || localStorage.getItem('sekai-app-pid') || ''; } catch (e) {}
$('#pid').value = pid; $('#vs').value = q.get('vs') || '';
window.__profile = { state, go, build, loadPlayer };
if (q.get('id')) go();
</script>
